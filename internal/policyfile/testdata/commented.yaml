# Our policy. Edited by hand and by mashctl.
default: deny   # closed unless a rule opens it

endpoints:
  # the front desk
  web-intake:
    labels: {net: dmz, internet: "yes"}

  support-bot:
    labels:
      net: dmz
      team: support   # who answers

  billing-agent:   # no labels yet
  # the tools
  deploy-bot: {labels: {net: internal}}

# rules follow

rules:
  - name: dmz-talks
    action: allow
    from: {net: dmz}
    to: {net: dmz}

tests:
  - {from: web-intake, to: support-bot, expect: allow}

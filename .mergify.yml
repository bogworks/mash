# Mergify merge queue for bogworks/mash, mirroring the orchestrator's queue (its .mergify.yml explains each choice in
# full). Every key is documented at https://docs.mergify.com/ . The checks named here are job names in ci.yml,
# adr-lint.yml or label-reset.yml; internal/release/mergify_test.go fails if one of them is not a job one of those runs,
# since a name CI never publishes can never be satisfied and the queue would time out.
# Those Actions checks are written `@github-actions/<name>`. A plain `check-success = pr-check` matches a status or a
# check run of that name by whoever posted it, so anyone who can write commit statuses could forge pr-check, adr-lint or
# label-reset; qualifying with the app binds the condition to GitHub Actions. codex-review stays plain: it IS a commit
# status (scripts/review-pr), no app posts it as a check. lead-review (scripts/lead-approve) is no longer a queue condition.

# Commands in a comment (`@mergifyio requeue`): Mergify's default restriction is `sender-permission >= write`. Our automation comments as a GitHub App
# (login miremanager[bot]), which Mergify sees with permission none, so its `@mergifyio requeue` was refused. An App cannot be a
# collaborator, so the one command the automation needs is allowed for that one sender; every other command and sender keeps the default. Requeue only puts a pull request
# that already passed the merge protections back into the queue; it merges nothing itself.
commands_restrictions:
  requeue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = miremanager[bot]

# One ordered queue, one queue run at a time: fast-forward allows only serial mode
# (https://docs.mergify.com/merge-queue/queue-modes/).
merge_queue:
  mode: serial
  max_parallel_checks: 1

# A pull request is queued by itself once it is not a draft and not held; queue_conditions still make it wait for
# codex-review and pr-check. `hold` is the operator's brake on one PR. These take effect only with Merge Protections
# enabled on the repository (a dashboard setting; see the PR that added this file). The queue's checks are deliberately
# not repeated here: queue_conditions apply to every queued pull request however it was queued, so auto-merge only
# queues it and cannot skip them, and a second copy would be one more list to keep in step.
merge_protections_settings:
  auto_merge_conditions:
    - -draft
    - label != hold

# The ruleset's one required check is `Mergify Merge Protections` (docs/branch-protection.md). Without a rule here it
# is neutral on every pull request. This rule carries only the condition Mergify evaluates on the pull request itself:
# not held (same spelling as queue_conditions; internal/release/mergify_test.go fails if they drift). It must NOT hold check-success conditions: Mergify applies the
# rule's conditions to the queue draft's commit as merge conditions too, and a check such as adr-lint is skipped on a
# draft, so the queue refused every pull request (#424 deadlocked it). codex-review and adr-lint are enforced by the
# queue's queue_conditions at entry, and the branch rule on main refuses any merge that is not Mergify's. pr-check
# and label-reset are not repeated either.
# The rule is also kept off Mergify's own queue draft pull requests (head ref mergify/merge-queue/<hash>). The exemption needs BOTH the head ref and the author mergify[bot]: a head ref alone is not
# enough, because any same-repository writer can push a branch named mergify/merge-queue/x and switch the rule off. The
# `if` is therefore active when the ref does not match or the author is not mergify[bot]. Syntax:
# https://docs.mergify.com/merge-protections/custom-rules ; a rule whose `if` is not met is inactive.
merge_protections:
  - name: not held before merge
    description: A pull request into main needs no hold label.
    if:
      - base = main
      - or:
          - -head ~= ^mergify/merge-queue/
          - -author = mergify[bot]
      # Inactive for a docs-only pull request (no changed file matches the code regex, the same text as the docs queue's):
      # it needs no label, only the docs lint (pr-check) and adr-lint, enforced by the docs queue.
      - or:
          - files ~= ^(?!(.*\.md$|docs/))|^docs/(allowed_signers|review/policy\.json|skipped-releases\.txt|release-cutover)$
          - "#files >= 300"
    success_conditions:
      - label != hold

# A docs-only pull request needs only the docs lint ("linting docs is all that's required"): pr-check carries
# docs-lint, adr-lint is the ADR syntax check, and there is no codex-review and no lead-review. It has its
# own queue, first, so a docs-only pull request is never batched with a code one (a batch with one code pull request runs the
# full set) and a batch of docs-only ones clears in about the lint's time. A pull request enters it only when NO changed file
# matches the code regex below, which is scripts/ci-changes' definition of "not documentation" written as one regular
# expression; internal/release/mergify_test.go fails if the two disagree on any path, and if this text differs from the one in
# merge_protections (one source, written twice). Anything else, .github/, .mergify.yml, scripts/ and spec/ included, goes to the
# default queue below.
queue_rules:
  - name: docs
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != hold
      - "#files >= 1"
      # GitHub returns at most 3000 files of a pull request and Mergify cannot see past that (codex H1): a large pull request is never docs-only here.
      - "#files < 300"
      - -files ~= ^(?!(.*\.md$|docs/))|^docs/(allowed_signers|review/policy\.json|skipped-releases\.txt|release-cutover)$
      # Exception paths (ADR 0182): a pull request touching one needs the `lead-approved` label (label-reset removes it on every
      # push). EXCEPTION-PATHS regex: one source, written in the docs queue and the default queue; mergify_test.go fails if they differ.
      - or:
          - -files ~= ^(\.github/|\.mergify\.yml$|scripts/(ci-|gate|release|build-twice|buildrelease|adrlint|changelog|doclint|draft-guard|lead-approve|notes-base|publishcheck|repofiles|review)|internal/release/|spec/|docs/decisions/|contracts/|internal/policy|internal/listset(/|$))
          - label = lead-approved
      - check-success = @github-actions/pr-check
      - check-success = @github-actions/adr-lint
      - check-success = @github-actions/label-reset # on this head, so a label left by an earlier push cannot let an exception path in
      # lint (lint.yml): staticcheck, gofmt, vet. A docs-only pull request skips the job at job level and the check reports as skipped,
      # which check-success alone does not accept (Mergify: success only), so the skipped conclusion is allowed beside it.
      - or:
          - check-success = @github-actions/lint
          - check-skipped = @github-actions/lint
      - check-success = medium-dispositions # every codex medium answered in Review-Dispositions; docs-only and no-review heads report success
    merge_conditions:
      - check-success = @github-actions/pr-check
    batch_size:
      min: 1
      max: 5
    max_checks_retries: 1
    checks_timeout: 30 min
    merge_method: fast-forward
  - name: default
    # To enter the queue (evaluated on the pull request): a pull request enters by itself when it has a base of main, is
    # not a draft, has no conflict, is not held, and codex-review (the commit status the orchestrator's review watcher,
    # scripts/review-pr, posts on the head), pr-check (ci.yml's aggregate of every required job), adr-lint and
    # label-reset (it must have run on this head, so a push cannot slip in on the previous head's label) are green. No
    # approval is needed (ADR 0177) except on exception paths, which need the `lead-approved` label (removed on every push
    # by label-reset, ADR 0182); `hold` is the other brake, and its reason is written on the pull request.
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != hold
      # Exception paths (ADR 0182): a pull request touching one needs the `lead-approved` label (label-reset removes it on every
      # push). EXCEPTION-PATHS regex: one source, written in the docs queue and the default queue; mergify_test.go fails if they differ.
      - or:
          - -files ~= ^(\.github/|\.mergify\.yml$|scripts/(ci-|gate|release|build-twice|buildrelease|adrlint|changelog|doclint|draft-guard|lead-approve|notes-base|publishcheck|repofiles|review)|internal/release/|spec/|docs/decisions/|contracts/|internal/policy|internal/listset(/|$))
          - label = lead-approved
      # GitHub lists at most 3000 files of a pull request and Mergify cannot see past that: a pull request that large could hide an
      # exception path, so it too needs the label.
      - or:
          - "#files < 3000"
          - label = lead-approved
      - check-success = codex-review
      - check-success = @github-actions/pr-check
      - check-success = @github-actions/adr-lint
      - check-success = @github-actions/label-reset
      # lint (lint.yml): a code pull request needs it to pass; a skipped lint is not accepted here (a cancelled run also skips the job,
      # codex H1). Only the docs queue, which takes docs-only pull requests alone, accepts a skipped lint.
      - check-success = @github-actions/lint
      - check-success = medium-dispositions
    # To merge (evaluated on the queue branch's run of the exact combination): pr-check again, since a batch's
    # combined code can break what each pull request passed alone. It needs test (both OSes) and reproducible.
    merge_conditions:
      - check-success = @github-actions/pr-check
      # lint on the queue branch's combined commit too (codex H1, round 2). A code batch always runs lint; the docs queue's
      # merge_conditions stay pr-check alone, since a docs-only batch skips lint.
      - check-success = @github-actions/lint
    # mash sees a few pull requests a day: a batch is whatever is queued, up to 5, with no wait for company. The
    # macOS leg is the slowest job, so fewer, larger runs are cheaper than many.
    batch_size:
      min: 1
      max: 5
    # A failed batch is run once more before it is bisected: a flaky check (mash#6) costs a rerun, not an innocent
    # ejection. Allowed because max_parallel_checks is 1.
    max_checks_retries: 1
    # test and reproducible are allowed 30 minutes each, and the macOS runner may be busy with another job first.
    checks_timeout: 60 min
    # main moves to the queue branch's head, the exact commit the merge_conditions passed on, so main is always a
    # tested commit. Branch protection must let Mergify bypass the pull request requirement: it pushes main itself.
    merge_method: fast-forward

# First matching rule wins; an unmatched pull request gets medium (2000). docs-only > pipeline > critical > normal > docs label.
priority_rules:
  # A docs-only pull request (the docs queue's regex, same text) goes ahead of everything: its batch takes a couple of minutes.
  - name: docs-only
    conditions:
      - "#files >= 1"
      - "#files < 300"
      - -files ~= ^(?!(.*\.md$|docs/))|^docs/(allowed_signers|review/policy\.json|skipped-releases\.txt|release-cutover)$
    priority: 5000
  - name: pipeline
    conditions:
      - label = pipeline
    priority: 4000
  - name: critical
    conditions:
      - label = critical
    priority: 3000
    allow_checks_interruption: true
  - name: docs
    conditions:
      - label = docs
    priority: 1000

# Not expressible in Mergify: removing `safe-to-review` when an outside author pushes a new commit. Rules are
# conditions on the pull request's current state, not on events, and no condition says "the head changed since the
# label was set". That belongs to the review watcher, which sees each head.

# A maintainer's approval on an OUTSIDE author's pull request must not carry over to code pushed after it: the first rule
# below has Mergify dismiss approvals when that author pushes a new commit (`when: synchronize`). Approval is no longer a
# queue condition (ADR 0177), so this only keeps a recorded approval honest; it excludes pull requests authored by the
# maintainer's login (`-author = randybias`), which is the login agents push as. GitHub's own "Dismiss stale pull request
# approvals when new commits are pushed" setting would do the same for every author, but it is a target in
# docs/branch-protection.md, not set today (the ruleset has no pull-request rule).
# Labels and notices, so a session sets only `critical` by hand (Workflow Automation, a dashboard setting).
pull_request_rules:
  - name: dismiss approvals when an outside author pushes
    conditions:
      - base = main
      - -author = randybias
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize
        message: "A new commit was pushed after this approval, so it is dismissed: a maintainer approves the new head."
  - name: docs label when every changed file is docs/** or *.md
    conditions:
      - base = main
      - "#files >= 1"
      - -files ~= ^(?!docs/|.*\.md$)
    actions:
      label:
        toggle:
          - docs
  - name: pipeline label when the pipeline changes
    conditions:
      - base = main
      - files ~= ^(\.github/|\.mergify\.yml$|internal/release/|scripts/)
    actions:
      label:
        add:
          - pipeline
  - name: label reverts critical
    conditions:
      - base = main
      - title ~= (?i)^revert
    actions:
      label:
        toggle:
          - critical
  - name: tell the author about a conflict
    conditions:
      - base = main
      - conflict
      - -closed
    actions:
      label:
        toggle:
          - conflict
      comment:
        message: "@{{author}} this pull request conflicts with main: rebase it onto origin/main and push; the review watcher reviews the new head."
  - name: tell the author about an ejection
    conditions:
      - queue-dequeue-reason = checks-failed
    actions:
      comment:
        message: "@{{author}} dequeued: the queue run of your pull request failed. Read the failing job and fix it in a new commit; Mergify queues it again once codex-review and pr-check pass."

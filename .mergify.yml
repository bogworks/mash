# Mergify merge queue for bogworks/mash, mirroring the orchestrator's queue (its .mergify.yml explains each choice in
# full). Every key is documented at https://docs.mergify.com/ . The checks named here are job names in ci.yml,
# adr-lint.yml or label-reset.yml; internal/release/mergify_test.go fails if one of them is not a job one of those runs,
# since a name CI never publishes can never be satisfied and the queue would time out.

# One ordered queue, one queue run at a time: fast-forward allows only serial mode
# (https://docs.mergify.com/merge-queue/queue-modes/).
merge_queue:
  mode: serial
  max_parallel_checks: 1

# A pull request is queued by itself once it is not a draft and not held; queue_conditions still make it wait for
# codex-review and pr-check. `hold` is the operator's brake on one PR. These take effect only with Merge Protections
# enabled on the repository (a dashboard setting; see the PR that added this file). The approval-or-`lead-approved` gate
# is deliberately not repeated here: queue_conditions apply to every queued pull request however it was queued, so
# auto-merge only queues it and cannot skip that gate, and a second copy would be one more list to keep in step.
merge_protections_settings:
  auto_merge_conditions:
    - -draft
    - label != hold

# The ruleset's one required check is `Mergify Merge Protections` (docs/branch-protection.md). Without a rule here it
# is neutral on every pull request, and a pull request that is green on CI but lacks codex-review and an approval could
# be merged through the API outside the queue. This rule mirrors the queue entry conditions that matter at that point:
# codex-review, adr-lint, a recorded approval or `lead-approved`, and not held. Same spelling as queue_conditions
# (internal/release/mergify_test.go fails if the two drift). adr-lint is redundant with the ruleset and the queue, which
# both require it, and is repeated deliberately because it is cheap; queue drafts are exempt by the `if` below. pr-check
# and label-reset are not repeated: the ruleset and the queue already require them. The rule must NOT apply to Mergify's own queue draft pull requests (head
# ref mergify/merge-queue/<hash>): a draft has no approval and no label, so the rule would fail on it and the queue
# would deadlock. The exemption needs BOTH conditions: the head ref matches AND the author is Mergify's bot. A head ref
# alone is not enough, because any same-repository writer can push a branch named mergify/merge-queue/x, which would
# make the rule inactive, the required check neutral and the pull request API-mergeable without codex-review or an
# approval. The `if` below is therefore active when either the ref does not match or the author is not mergify[bot]
# (not (ref and bot) = (not ref) or (not bot)). Syntax: https://docs.mergify.com/merge-protections/custom-rules ; a rule whose `if` is not met is
# inactive and does not affect the check.
merge_protections:
  - name: codex-review and approval before merge
    description: A pull request into main needs codex-review, a maintainer approval or lead-approved, and no hold label.
    if:
      - base = main
      - or:
          - -head ~= ^mergify/merge-queue/
          - -author = mergify[bot]
    success_conditions:
      - check-success = codex-review
      - check-success = adr-lint
      - or:
          - approved-reviews-by = randybias
          - label = lead-approved
      - label != hold

queue_rules:
  - name: default
    # To enter the queue (evaluated on the pull request). codex-review is the commit status the orchestrator's review
    # watcher (scripts/review-pr) posts on the head; pr-check is ci.yml's aggregate of every required job.
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != hold
      - check-success = codex-review
      - check-success = pr-check
      # The decision gate (adr-lint.yml): a Decision: line in the body, valid ADRs. It is a queue condition as well as a
      # required check (docs/branch-protection.md), so a pull request cannot merge while it fails.
      - check-success = adr-lint
      # label-reset (.github/workflows/label-reset.yml) removes lead-approved and decision-confirmed on every push. It
      # must have run, and succeeded, on this head before it can enter the queue, so a push cannot slip in on the
      # previous head's label (fail closed).
      - check-success = label-reset
      # Entry needs a recorded maintainer approval or the `lead-approved` label. Authorship is NOT a condition: the
      # maintainer's login authors agent pull requests too (every agent pushes as it), so `author = <maintainer>` is
      # true of any agent pull request and proves nothing; with it, only the `hold` label stood between an agent's
      # pull request and the queue, and that failed once. The lead applies `lead-approved` at merge time, and
      # .github/workflows/label-reset.yml removes it on every push, so the label never covers later code
      # (docs/decisions/0078-*.md). A recorded approval is not reset the same way: the dismiss-approvals rule below
      # skips pull requests authored by the maintainer's login (agents push as it), so on those a push does not
      # dismiss an approval through Mergify; it dismisses one only on an outside author's pull request. The queue run executes the pull request's code in CI, and codex-review reads
      # attacker-controlled text, so neither a green check nor the review is enough on its own
      # (docs/security/threat-model.md). The approver's login is listed explicitly, not "any approval": Mergify's docs
      # do not say that `approved-reviews-by` counts only reviewers with write access (they say it of other review
      # conditions), so the list is what we rely on. Add a maintainer's login to this line and to the
      # dismiss-approvals rule below. `label != hold` above stays the brake on top of this gate.
      - or:
          - approved-reviews-by = randybias
          - label = lead-approved
    # To merge (evaluated on the queue branch's run of the exact combination): pr-check again, since a batch's
    # combined code can break what each pull request passed alone. It needs test (both OSes) and reproducible.
    merge_conditions:
      - check-success = pr-check
    # mash sees a few pull requests a day: a batch is whatever is queued, up to 5, with no wait for company. The
    # macOS leg is the slowest job, so fewer, larger runs are cheaper than many.
    batch_size:
      min: 1
      max: 5
    # A failed batch is run once more before it is bisected: a flaky check (mash#6) costs a rerun, not an innocent
    # ejection. Allowed because max_parallel_checks is 1.
    max_checks_retries: 1
    # test and reproducible are allowed 30 minutes each, and the macOS runner may be busy with another job first.
    checks_timeout: 60 min
    # main moves to the queue branch's head, the exact commit the merge_conditions passed on, so main is always a
    # tested commit. Branch protection must let Mergify bypass the pull request requirement: it pushes main itself.
    merge_method: fast-forward

# First matching rule wins; an unmatched pull request gets medium (2000). pipeline > critical > normal > docs.
priority_rules:
  - name: pipeline
    conditions:
      - label = pipeline
    priority: 4000
  - name: critical
    conditions:
      - label = critical
    priority: 3000
    allow_checks_interruption: true
  - name: docs
    conditions:
      - label = docs
    priority: 1000

# Not expressible in Mergify: removing `safe-to-review` when an outside author pushes a new commit. Rules are
# conditions on the pull request's current state, not on events, and no condition says "the head changed since the
# label was set". That belongs to the review watcher, which sees each head.

# A maintainer's approval on an OUTSIDE author's pull request must not carry over to code pushed after it: the first rule
# below has Mergify dismiss approvals when that author pushes a new commit (`when: synchronize`), so
# `approved-reviews-by` in the queue conditions turns false until a maintainer approves the new head. The rule excludes
# pull requests authored by the maintainer's login (`-author = randybias`), which is the login agents push as, so on
# those Mergify dismisses nothing; there the label path is the gate that is reset on every push (label-reset.yml), and
# GitHub does not let an author approve their own pull request. GitHub's own "Dismiss stale pull request approvals
# when new commits are pushed" setting would do the same for every author, but it is a target in
# docs/branch-protection.md, not set today (the ruleset has no pull-request rule).
# Labels and notices, so a session sets only `critical` by hand (Workflow Automation, a dashboard setting).
pull_request_rules:
  - name: dismiss approvals when an outside author pushes
    conditions:
      - base = main
      - -author = randybias
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize
        message: "A new commit was pushed after this approval, so it is dismissed: a maintainer approves the new head."
  - name: docs label when every changed file is docs/** or *.md
    conditions:
      - base = main
      - "#files >= 1"
      - -files ~= ^(?!docs/|.*\.md$)
    actions:
      label:
        toggle:
          - docs
  - name: pipeline label when the pipeline changes
    conditions:
      - base = main
      - files ~= ^(\.github/|\.mergify\.yml$|internal/release/|scripts/)
    actions:
      label:
        add:
          - pipeline
  - name: label reverts critical
    conditions:
      - base = main
      - title ~= (?i)^revert
    actions:
      label:
        toggle:
          - critical
  - name: tell the author about a conflict
    conditions:
      - base = main
      - conflict
      - -closed
    actions:
      label:
        toggle:
          - conflict
      comment:
        message: "@{{author}} this pull request conflicts with main: rebase it onto origin/main and push; the review watcher reviews the new head."
  - name: tell the author about an ejection
    conditions:
      - queue-dequeue-reason = checks-failed
    actions:
      comment:
        message: "@{{author}} dequeued: the queue run of your pull request failed. Read the failing job and fix it in a new commit; Mergify queues it again once codex-review and pr-check pass."

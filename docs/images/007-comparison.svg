<svg xmlns="http://www.w3.org/2000/svg" class="mash" viewBox="0 0 860 512" width="860" height="512" role="img" aria-labelledby="d7-title d7-desc"><title id="d7-title">Where mash sits among six ways to move messages between agents</title><desc id="d7-desc">Matrix of eight properties by six mechanisms: Durable store-and-forward: mash yes, SAP + Synadia plugins no, NATS JetStream yes, A2A 1.0 partial, MCP Agent Mail yes, Claude Code cross-session partial; At-least-once delivery: mash yes, SAP + Synadia plugins no, NATS JetStream yes, A2A 1.0 partial, MCP Agent Mail partial, Claude Code cross-session partial; Per-message sender proof: mash yes, SAP + Synadia plugins partial, NATS JetStream no, A2A 1.0 no, MCP Agent Mail no, Claude Code cross-session no; Outbound-only (works behind NAT): mash yes, SAP + Synadia plugins yes, NATS JetStream yes, A2A 1.0 no, MCP Agent Mail partial, Claude Code cross-session yes; Discovery and presence: mash yes, SAP + Synadia plugins yes, NATS JetStream partial, A2A 1.0 partial, MCP Agent Mail partial, Claude Code cross-session yes; Live request-reply: mash yes, SAP + Synadia plugins yes, NATS JetStream yes, A2A 1.0 yes, MCP Agent Mail no, Claude Code cross-session partial; Wake an idle agent: mash partial, SAP + Synadia plugins partial, NATS JetStream no, A2A 1.0 partial, MCP Agent Mail no, Claude Code cross-session yes; Host independence: mash partial, SAP + Synadia plugins yes, NATS JetStream yes, A2A 1.0 yes, MCP Agent Mail yes, Claude Code cross-session no.</desc>
<style>

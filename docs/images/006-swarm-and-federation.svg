<svg xmlns="http://www.w3.org/2000/svg" class="mash" viewBox="0 0 860 492" width="860" height="492" role="img" aria-labelledby="d6-title d6-desc"><title id="d6-title">Mail mesh inside, federation at the edge</title><desc id="d6-desc">Inside one operator&#x27;s trust domain, agent sessions connect out to one NATS account and leave each other mash mail. One of them also acts as an A2A client to a service a partner runs independently.</desc><style>
.mash{--bg:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--strong:#8c959f;--teal:#0b7a78;--tealsoft:#e1f3f2;--blue:#2860d8;--bluesoft:#e7eefc;--violet:#6b46db;--violetsoft:#eee9fc;--amber:#965800;--ambersoft:#fcf1dc;--green:#176f3d;--greensoft:#e1f3e7;--red:#c42f3b;--redsoft:#fbe6e8;--gray:#636c76;--graysoft:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.mash{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9da7b3;--line:#30363d;--strong:#6e7681;--teal:#3cc2bf;--tealsoft:#0e2b2c;--blue:#79a6ff;--bluesoft:#132340;--violet:#a98fff;--violetsoft:#221a42;--amber:#f2b552;--ambersoft:#2e220b;--green:#56d38a;--greensoft:#0f2a1b;--red:#ff7b84;--redsoft:#3a161a;--gray:#9da7b3;--graysoft:#21262d}}
.mash .bg{fill:var(--bg)}
.mash text{fill:var(--ink)}
.mash .t-title{font-size:18px;font-weight:650}
.mash .t-sub{font-size:13px;fill:var(--muted)}
.mash .t-h{font-size:13px;font-weight:600}
.mash .t-b{font-size:13px}
.mash .t-s{font-size:12px;fill:var(--muted)}
.mash .t-i{font-size:12px}
.mash .t-cap{font-size:12px;fill:var(--muted)}
.mash .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.mash .w6{font-weight:600}
.mash .mid{text-anchor:middle}
.mash .end{text-anchor:end}
.mash .x-teal{fill:var(--teal)} .mash .x-blue{fill:var(--blue)} .mash .x-violet{fill:var(--violet)}
.mash .x-amber{fill:var(--amber)} .mash .x-green{fill:var(--green)} .mash .x-red{fill:var(--red)}
.mash .x-gray{fill:var(--gray)} .mash .x-muted{fill:var(--muted)}
.mash .card{fill:var(--panel);stroke:var(--line);stroke-width:1}
.mash .plain{fill:var(--bg);stroke:var(--line);stroke-width:1}
.mash .rule{stroke:var(--line);stroke-width:1;fill:none}
.mash .bound{fill:none;stroke:var(--strong);stroke-width:1;stroke-dasharray:4 4}
.mash .domain{fill:none;stroke:var(--strong);stroke-width:1.25}
.mash .f-teal{fill:var(--tealsoft);stroke:var(--teal);stroke-width:1.25}
.mash .f-blue{fill:var(--bluesoft);stroke:var(--blue);stroke-width:1.25}
.mash .f-violet{fill:var(--violetsoft);stroke:var(--violet);stroke-width:1.25}
.mash .f-amber{fill:var(--ambersoft);stroke:none}
.mash .f-violet-n{fill:var(--violetsoft);stroke:none}
.mash .f-green{fill:var(--greensoft);stroke:var(--green);stroke-width:1.25}
.mash .f-red{fill:var(--redsoft);stroke:var(--red);stroke-width:1.25}
.mash .f-gray{fill:var(--graysoft);stroke:var(--line);stroke-width:1}
.mash .f-unsigned{fill:none;stroke:var(--strong);stroke-width:1;stroke-dasharray:4 3}
.mash .solid-teal{fill:var(--teal)} .mash .solid-violet{fill:var(--violet)} .mash .solid-green{fill:var(--green)}
.mash .solid-ink{fill:var(--ink)} .mash .solid-amber{fill:var(--amber)} .mash .solid-gray{fill:var(--gray)}
.mash .solid-red{fill:var(--red)} .mash .solid-blue{fill:var(--blue)}
.mash .a{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mash .a-teal{stroke:var(--teal)} .mash .a-violet{stroke:var(--violet)} .mash .a-amber{stroke:var(--amber)}
.mash .a-gray{stroke:var(--gray)} .mash .a-ink{stroke:var(--ink)} .mash .a-green{stroke:var(--green)}
.mash .a-muted{stroke:var(--strong)}
.mash .dash{stroke-dasharray:7 5}
.mash .dots{stroke-dasharray:0.5 5;stroke-width:2}
.mash .thin{stroke-width:1}
</style><rect x="0.5" y="0.5" width="859" height="491" rx="14" class="bg"/><text x="32" y="42" class="t-title">Mail mesh inside, federation at the edge</text><defs><marker id="d6-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-teal"/></marker><marker id="d6-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-gray"/></marker></defs><text x="32" y="66" class="t-sub">mash fits one operator&#x27;s trust domain; A2A fits services that others run. Both can run at once.</text><rect x="32" y="90" width="500" height="300" rx="14" class="domain"/><text x="52" y="116" class="t-h">Your trust domain · one NATS account</text><text x="52" y="134" class="t-s">sessions that start and stop on their own schedules</text><rect x="64" y="166" width="100" height="48" rx="8" class="card"/><text x="114" y="186" class="t-h mid">alice</text><text x="114" y="204" class="t-s mid">session</text><path d="M114,214 L114,300" class="a a-teal " marker-end="url(#d6-teal)"/><rect x="176" y="166" width="100" height="48" rx="8" class="card"/><text x="226" y="186" class="t-h mid">bob</text><text x="226" y="204" class="t-s mid">session</text><path d="M226,214 L226,300" class="a a-teal " marker-end="url(#d6-teal)"/><rect x="288" y="166" width="100" height="48" rx="8" class="card"/><text x="338" y="186" class="t-h mid">carol</text><text x="338" y="204" class="t-s mid">session</text><path d="M338,214 L338,300" class="a a-teal " marker-end="url(#d6-teal)"/><rect x="400" y="166" width="100" height="48" rx="8" class="card"/><text x="450" y="186" class="t-h mid">dave</text><text x="450" y="204" class="t-s mid">+ A2A client</text><path d="M450,214 L450,300" class="a a-teal " marker-end="url(#d6-teal)"/><rect x="60" y="302" width="444" height="40" rx="20" class="f-teal"/><text x="282" y="327" class="t-h mid x-teal">NATS · mash mail</text><text x="282" y="370" class="t-s mid">signed mail that waits for sessions that come and go</text><rect x="620" y="150" width="208" height="180" rx="14" class="domain"/><text x="640" y="176" class="t-h">Partner&#x27;s domain</text><rect x="644" y="200" width="160" height="58" rx="8" class="f-gray"/><text x="724" y="225" class="t-h mid">A2A service</text><text x="724" y="244" class="t-s mid">HTTP · Agent Card</text><text x="640" y="286" class="t-s">run independently,</text><text x="640" y="304" class="t-s">by another operator</text><path d="M500,190 L640,226" class="a a-gray " marker-end="url(#d6-gray)"/><text x="556" y="196" class="t-i w6 x-gray">A2A</text><text x="32" y="422" class="t-h x-teal">mash inside</text><text x="32" y="440" class="t-s">one-to-one signed mail within one trust domain</text><text x="440" y="422" class="t-h x-gray">A2A between</text><text x="440" y="440" class="t-s">task exchange with independently run services</text><text x="32" y="470" class="t-cap">Arrows point from the side that opens the connection. mash ships no A2A bridge: an agent that needs both speaks both.</text></svg>

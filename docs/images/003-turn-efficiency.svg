<svg xmlns="http://www.w3.org/2000/svg" class="mash" viewBox="0 0 860 640" width="860" height="640" role="img" aria-labelledby="d3-title d3-desc"><title id="d3-title">Mail costs a model turn only when it should</title><desc id="d3-desc">A busy session sees new mail with its next tool result, at no extra turn. A burst of 12 sends cost 2 turns (one digest of 11, then 1) where per-message delivery costs 12. In an idle session, urgent mail from a verified sender woke it in 2-4 s, task mail at 47 s, and fyi mail caused no turn in 95 s.</desc><style>
.mash{--bg:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--strong:#8c959f;--teal:#0b7a78;--tealsoft:#e1f3f2;--blue:#2860d8;--bluesoft:#e7eefc;--violet:#6b46db;--violetsoft:#eee9fc;--amber:#965800;--ambersoft:#fcf1dc;--green:#176f3d;--greensoft:#e1f3e7;--red:#c42f3b;--redsoft:#fbe6e8;--gray:#636c76;--graysoft:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.mash{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9da7b3;--line:#30363d;--strong:#6e7681;--teal:#3cc2bf;--tealsoft:#0e2b2c;--blue:#79a6ff;--bluesoft:#132340;--violet:#a98fff;--violetsoft:#221a42;--amber:#f2b552;--ambersoft:#2e220b;--green:#56d38a;--greensoft:#0f2a1b;--red:#ff7b84;--redsoft:#3a161a;--gray:#9da7b3;--graysoft:#21262d}}
.mash .bg{fill:var(--bg)}
.mash text{fill:var(--ink)}
.mash .t-title{font-size:18px;font-weight:650}
.mash .t-sub{font-size:13px;fill:var(--muted)}
.mash .t-h{font-size:13px;font-weight:600}
.mash .t-b{font-size:13px}
.mash .t-s{font-size:12px;fill:var(--muted)}
.mash .t-i{font-size:12px}
.mash .t-cap{font-size:12px;fill:var(--muted)}
.mash .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.mash .w6{font-weight:600}
.mash .mid{text-anchor:middle}
.mash .end{text-anchor:end}
.mash .x-teal{fill:var(--teal)} .mash .x-blue{fill:var(--blue)} .mash .x-violet{fill:var(--violet)}
.mash .x-amber{fill:var(--amber)} .mash .x-green{fill:var(--green)} .mash .x-red{fill:var(--red)}
.mash .x-gray{fill:var(--gray)} .mash .x-muted{fill:var(--muted)}
.mash .card{fill:var(--panel);stroke:var(--line);stroke-width:1}
.mash .plain{fill:var(--bg);stroke:var(--line);stroke-width:1}
.mash .rule{stroke:var(--line);stroke-width:1;fill:none}
.mash .bound{fill:none;stroke:var(--strong);stroke-width:1;stroke-dasharray:4 4}
.mash .domain{fill:none;stroke:var(--strong);stroke-width:1.25}
.mash .f-teal{fill:var(--tealsoft);stroke:var(--teal);stroke-width:1.25}
.mash .f-blue{fill:var(--bluesoft);stroke:var(--blue);stroke-width:1.25}
.mash .f-violet{fill:var(--violetsoft);stroke:var(--violet);stroke-width:1.25}
.mash .f-amber{fill:var(--ambersoft);stroke:none}
.mash .f-violet-n{fill:var(--violetsoft);stroke:none}
.mash .f-green{fill:var(--greensoft);stroke:var(--green);stroke-width:1.25}
.mash .f-red{fill:var(--redsoft);stroke:var(--red);stroke-width:1.25}
.mash .f-gray{fill:var(--graysoft);stroke:var(--line);stroke-width:1}
.mash .f-unsigned{fill:none;stroke:var(--strong);stroke-width:1;stroke-dasharray:4 3}
.mash .solid-teal{fill:var(--teal)} .mash .solid-violet{fill:var(--violet)} .mash .solid-green{fill:var(--green)}
.mash .solid-ink{fill:var(--ink)} .mash .solid-amber{fill:var(--amber)} .mash .solid-gray{fill:var(--gray)}
.mash .solid-red{fill:var(--red)} .mash .solid-blue{fill:var(--blue)}
.mash .a{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mash .a-teal{stroke:var(--teal)} .mash .a-violet{stroke:var(--violet)} .mash .a-amber{stroke:var(--amber)}
.mash .a-gray{stroke:var(--gray)} .mash .a-ink{stroke:var(--ink)} .mash .a-green{stroke:var(--green)}
.mash .a-muted{stroke:var(--strong)}
.mash .dash{stroke-dasharray:7 5}
.mash .dots{stroke-dasharray:0.5 5;stroke-width:2}
.mash .thin{stroke-width:1}
</style><rect x="0.5" y="0.5" width="859" height="639" rx="14" class="bg"/><text x="32" y="42" class="t-title">Mail costs a model turn only when it should</text><defs><marker id="d3-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-violet"/></marker><marker id="d3-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-gray"/></marker></defs><text x="32" y="66" class="t-sub">Measured in live runs under the Claude Code plugin. The waits are defaults you can change.</text><text x="32" y="104" class="t-h">1 · Busy session</text><text x="32" y="122" class="t-s">New mail rides in on the</text><text x="32" y="138" class="t-s">next tool result.</text><rect x="200" y="128" width="520" height="28" rx="14" class="f-gray"/><text x="214" y="147" class="t-s">one model turn</text><circle cx="330" cy="142" r="5" class="plain"/><circle cx="430" cy="142" r="5" class="plain"/><circle cx="530" cy="142" r="5" class="plain"/><circle cx="630" cy="142" r="5" class="plain"/><text x="330" y="176" class="t-s mid">tool result</text><g><rect x="372" y="92" width="18" height="13" rx="2" class="f-violet"/><path d="M373.5,94 L381,99.5 L388.5,94" class="a a-violet thin"/></g><path d="M386,106 L425,133" class="a a-violet " marker-end="url(#d3-violet)"/><g><rect x="560" y="92" width="18" height="13" rx="2" class="f-violet"/><path d="M561.5,94 L569,99.5 L576.5,94" class="a a-violet thin"/></g><path d="M574,106 L625,133" class="a a-violet " marker-end="url(#d3-violet)"/><text x="828" y="147" class="t-h x-green end">0 extra turns</text><path d="M32,198 L828,198" class="rule"/><text x="32" y="226" class="t-h">2 · A burst of 12 sends</text><text x="32" y="244" class="t-s">Gathered until 100 ms</text><text x="32" y="260" class="t-s">of quiet, then shown in</text><text x="32" y="276" class="t-s">full or as a digest.</text><text x="200" y="238" class="t-s">one turn per message</text><rect x="200" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="236" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="272" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="308" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="344" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="380" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="416" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="452" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="488" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="524" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="560" y="246" width="28" height="22" rx="5" class="f-red"/><rect x="596" y="246" width="28" height="22" rx="5" class="f-red"/><text x="828" y="262" class="t-h x-red end">12 turns</text><text x="200" y="294" class="t-s w6">mash, measured</text><rect x="200" y="302" width="232" height="22" rx="5" class="f-violet"/><text x="316" y="317" class="t-i mid">digest · 11 messages</text><rect x="452" y="302" width="28" height="22" rx="5" class="f-violet"/><text x="466" y="317" class="t-i mid">1</text><text x="492" y="317" class="t-s">the 12th, from the slowest sender</text><text x="828" y="318" class="t-h x-green end">2 turns</text><path d="M32,350 L828,350" class="rule"/><text x="32" y="378" class="t-h">3 · Idle session</text><text x="32" y="396" class="t-s">The mail&#x27;s kind decides</text><text x="32" y="412" class="t-s">wake or wait.</text><path d="M434.0,392 L434.0,528" class="a a-muted thin" stroke-dasharray="3 3"/><text x="442.0" y="392" class="t-s">idle wake · 45 s default</text><text x="194" y="438" class="t-i end">urgent, verified sender</text><circle cx="200" cy="434" r="4" class="solid-ink"/><rect x="210.4" y="428" width="10.4" height="12" rx="6" class="f-green"/><text x="230.8" y="438" class="t-i w6 x-green">2-4 s</text><text x="194" y="470" class="t-i end">task</text><circle cx="200" cy="466" r="4" class="solid-ink"/><path d="M208,466 L435.4,466" class="a a-muted dots"/><circle cx="444.4" cy="466" r="6" class="f-green"/><text x="456.4" y="470" class="t-i w6 x-green">woke at 47 s</text><text x="194" y="502" class="t-i end">fyi</text><circle cx="200" cy="498" r="4" class="solid-ink"/><path d="M208,498 L694.0,498" class="a a-muted dots"/><path d="M694.0,491 L694.0,505" class="a a-muted"/><text x="704.0" y="502" class="t-i w6">no turn</text><text x="704.0" y="518" class="t-s">in 95 s</text><path d="M200,530 L720.0,530" class="rule"/><path d="M200.0,530 L200.0,535" class="rule"/><text x="200.0" y="550" class="t-s mid">0 s</text><path d="M278.0,530 L278.0,535" class="rule"/><text x="278.0" y="550" class="t-s mid">15 s</text><path d="M356.0,530 L356.0,535" class="rule"/><text x="356.0" y="550" class="t-s mid">30 s</text><path d="M434.0,530 L434.0,535" class="rule"/><text x="434.0" y="550" class="t-s mid">45 s</text><path d="M512.0,530 L512.0,535" class="rule"/><text x="512.0" y="550" class="t-s mid">60 s</text><path d="M590.0,530 L590.0,535" class="rule"/><text x="590.0" y="550" class="t-s mid">75 s</text><path d="M668.0,530 L668.0,535" class="rule"/><text x="668.0" y="550" class="t-s mid">90 s</text><text x="178" y="550" class="t-s end">since send</text><text x="32" y="582" class="t-cap">Time runs left to right. Arrows show mail entering the session. Live runs: burst 2026-10-22, idle 2026-10-29.</text><text x="32" y="600" class="t-cap">Cost: waking mail to an idle session waits for the idle wake (45 s default, 5 s to 30 min).</text><text x="32" y="618" class="t-cap">Not compared here: a polling design spends a tool call on every check, mail or not.</text></svg>

x="435.0" y="406" class="t-s mid">config.json, creds, policy.md</text><rect x="600" y="360" width="200" height="64" rx="8" class="card"/><text x="700.0" y="383" class="t-h mid">mash CLI</text><text x="700.0" y="400" class="t-s mid">send, read, inbox, who,</text><text x="700.0" y="414" class="t-s mid">prompt, status, admin</text><path d="M252,157 L478,157" class="a a-ink" marker-end="url(#d10-ink)"/><text x="366" y="136" class="t-i w6 mid">runs after each tool call</text><text x="366" y="150" class="t-i w6 mid">and prompt</text><path d="M152,184 L152,238" class="a a-ink" marker-end="url(#d10-ink)"/><text x="164" y="216" class="t-i w6">starts, MCP over stdio</text><path d="M252,267 L478,267" class="a a-gray" marker-end="url(#d10-gray)"/><text x="366" y="259" class="t-i x-gray w6 mid">writes files</text><path d="M580,184 L580,238" class="a a-gray" marker-end="url(#d10-gray)"/><text x="592" y="216" class="t-i x-gray w6">reads, marks shown and drained</text><path d="M230,294 L230,392 L318,392" class="a a-gray" marker-end="url(#d10-gray)"/><text x="242" y="340" class="t-i x-gray w6">reads</text><path d="M600,392 L552,392" class="a a-gray" marker-end="url(#d10-gray)"/><text x="576" y="384" class="t-i x-gray w6 mid">reads</text><path d="M100,294 L100,494" class="a a-teal" marker-end="url(#d10-teal)"/><text x="112" y="476" class="t-i x-teal w6">one NATS connection</text><path d="M700,424 L700,494" class="a a-teal" marker-end="url(#d10-teal)"/><text x="688" y="476" class="t-i x-teal w6 end">NATS connection per command</text><rect x="32" y="496" width="796" height="122" rx="10" class="bound"/><text x="44" y="516" class="t-s">NATS server</text><rect x="46" y="530" width="178" height="68" rx="8" class="f-teal"/><text x="135.0" y="553" class="t-h mid">Inbox streams</text><text x="135.0" y="572" class="t-s mid">inbox-NAME,</text><text x="135.0" y="586" class="t-s mid">one per endpoint</text><rect x="244" y="530" width="178" height="68" rx="8" class="f-teal"/><text x="333.0" y="568" class="t-h mid">KV mash-directory</text><rect x="442" y="530" width="178" height="68" rx="8" class="f-teal"/><text x="531.0" y="568" class="t-h mid">KV mash-leases</text><rect x="640" y="530" width="178" height="68" rx="8" class="f-teal"/><text x="729.0" y="559" class="t-h mid">SAP subjects</text><text x="729.0" y="578" class="t-s mid">prompt, status, hb, $SRV</text><text x="32" y="642" class="t-cap">Arrows point from the process that starts another process, opens a connection or opens a file.</text></svg>

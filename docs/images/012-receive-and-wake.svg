<svg xmlns="http://www.w3.org/2000/svg" class="mash" viewBox="0 0 860 990" width="860" height="990" role="img" aria-labelledby="d12-title d12-desc"><title id="d12-title">Receive and wake (data flow)</title><desc id="d12-desc">mash serve pulls mail from the inbox stream, verifies and spools it. A busy session gets it through the hook, an idle session through a channel event and a new turn. The hook marks the spool drained and serve acknowledges.</desc><style>
.mash{--bg:#ffffff;--panel:#f6f8fa;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--strong:#8c959f;--teal:#0b7a78;--tealsoft:#e1f3f2;--blue:#2860d8;--bluesoft:#e7eefc;--violet:#6b46db;--violetsoft:#eee9fc;--amber:#965800;--ambersoft:#fcf1dc;--green:#176f3d;--greensoft:#e1f3e7;--red:#c42f3b;--redsoft:#fbe6e8;--gray:#636c76;--graysoft:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.mash{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9da7b3;--line:#30363d;--strong:#6e7681;--teal:#3cc2bf;--tealsoft:#0e2b2c;--blue:#79a6ff;--bluesoft:#132340;--violet:#a98fff;--violetsoft:#221a42;--amber:#f2b552;--ambersoft:#2e220b;--green:#56d38a;--greensoft:#0f2a1b;--red:#ff7b84;--redsoft:#3a161a;--gray:#9da7b3;--graysoft:#21262d}}
.mash .bg{fill:var(--bg)}
.mash text{fill:var(--ink)}
.mash .t-title{font-size:18px;font-weight:650}
.mash .t-sub{font-size:13px;fill:var(--muted)}
.mash .t-h{font-size:13px;font-weight:600}
.mash .t-b{font-size:13px}
.mash .t-s{font-size:12px;fill:var(--muted)}
.mash .t-i{font-size:12px}
.mash .t-cap{font-size:12px;fill:var(--muted)}
.mash .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.mash .w6{font-weight:600}
.mash .mid{text-anchor:middle}
.mash .end{text-anchor:end}
.mash .x-teal{fill:var(--teal)} .mash .x-blue{fill:var(--blue)} .mash .x-violet{fill:var(--violet)}
.mash .x-amber{fill:var(--amber)} .mash .x-green{fill:var(--green)} .mash .x-red{fill:var(--red)}
.mash .x-gray{fill:var(--gray)} .mash .x-muted{fill:var(--muted)}
.mash .card{fill:var(--panel);stroke:var(--line);stroke-width:1}
.mash .plain{fill:var(--bg);stroke:var(--line);stroke-width:1}
.mash .rule{stroke:var(--line);stroke-width:1;fill:none}
.mash .bound{fill:none;stroke:var(--strong);stroke-width:1;stroke-dasharray:4 4}
.mash .domain{fill:none;stroke:var(--strong);stroke-width:1.25}
.mash .f-teal{fill:var(--tealsoft);stroke:var(--teal);stroke-width:1.25}
.mash .f-blue{fill:var(--bluesoft);stroke:var(--blue);stroke-width:1.25}
.mash .f-violet{fill:var(--violetsoft);stroke:var(--violet);stroke-width:1.25}
.mash .f-amber{fill:var(--ambersoft);stroke:none}
.mash .f-violet-n{fill:var(--violetsoft);stroke:none}
.mash .f-green{fill:var(--greensoft);stroke:var(--green);stroke-width:1.25}
.mash .f-red{fill:var(--redsoft);stroke:var(--red);stroke-width:1.25}
.mash .f-gray{fill:var(--graysoft);stroke:var(--line);stroke-width:1}
.mash .f-unsigned{fill:none;stroke:var(--strong);stroke-width:1;stroke-dasharray:4 3}
.mash .solid-teal{fill:var(--teal)} .mash .solid-violet{fill:var(--violet)} .mash .solid-green{fill:var(--green)}
.mash .solid-ink{fill:var(--ink)} .mash .solid-amber{fill:var(--amber)} .mash .solid-gray{fill:var(--gray)}
.mash .solid-red{fill:var(--red)} .mash .solid-blue{fill:var(--blue)}
.mash .a{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mash .a-teal{stroke:var(--teal)} .mash .a-violet{stroke:var(--violet)} .mash .a-amber{stroke:var(--amber)}
.mash .a-gray{stroke:var(--gray)} .mash .a-ink{stroke:var(--ink)} .mash .a-green{stroke:var(--green)}
.mash .a-muted{stroke:var(--strong)}
.mash .dash{stroke-dasharray:7 5}
.mash .dots{stroke-dasharray:0.5 5;stroke-width:2}
.mash .thin{stroke-width:1}
</style><rect x="0.5" y="0.5" width="859" height="989" rx="14" class="bg"/><text x="32" y="42" class="t-title">Receive and wake (data flow)</text><defs><marker id="d12-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-gray"/></marker><marker id="d12-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-ink"/></marker><marker id="d12-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 L2.6,5 z" class="solid-teal"/></marker></defs><text x="32" y="66" class="t-sub">Arrows point in the direction the data moves.</text><rect x="40" y="92" width="144" height="40" rx="8" class="f-teal"/><text x="112" y="117" class="t-h mid">Inbox stream</text><path d="M112,132 L112,940" class="rule"/><rect x="200" y="92" width="144" height="40" rx="8" class="card"/><text x="272" y="117" class="t-h mid">mash serve</text><path d="M272,132 L272,940" class="rule"/><rect x="360" y="92" width="144" height="40" rx="8" class="f-gray"/><text x="432" y="117" class="t-h mid">Spool</text><path d="M432,132 L432,940" class="rule"/><rect x="520" y="92" width="144" height="40" rx="8" class="card"/><text x="592" y="117" class="t-h mid">Claude Code</text><path d="M592,132 L592,940" class="rule"/><rect x="680" y="92" width="144" height="40" rx="8" class="card"/><text x="752" y="117" class="t-h mid">mash hook</text><path d="M752,132 L752,940" class="rule"/><text x="192.0" y="162" class="t-i mid">pull delivery of #42</text><text x="192.0" y="176" class="t-i mid">(durable consumer)</text><path d="M112,190 L270,190" class="a a-teal" marker-end="url(#d12-teal)"/><circle cx="136" cy="190" r="9" class="f-violet"/><text x="136" y="194" class="t-i mid w6">1</text><rect x="146.0" y="204" width="252" height="44" rx="8" class="f-amber"/><text x="158.0" y="224" class="t-i">verify signature, look up directory,</text><text x="158.0" y="240" class="t-i">assign trust label and kind</text><text x="352.0" y="272" class="t-i mid">write 42.json</text><text x="352.0" y="286" class="t-i mid">(message unacknowledged,</text><text x="352.0" y="300" class="t-i mid">ack deadline renewed)</text><path d="M272,314 L430,314" class="a a-gray" marker-end="url(#d12-gray)"/><circle cx="296" cy="314" r="9" class="f-violet"/><text x="296" y="318" class="t-i mid w6">2</text><rect x="32" y="332" width="796" height="470" rx="10" class="bound"/><text x="44" y="352" class="t-h x-muted">alt</text><text x="76" y="352" class="t-i">busy session (running tool calls)</text><text x="672.0" y="384" class="t-i mid">PostToolUse hook input</text><path d="M592,396 L750,396" class="a a-ink" marker-end="url(#d12-ink)"/><circle cx="616" cy="396" r="9" class="f-violet"/><text x="616" y="400" class="t-i mid w6">3</text><rect x="539" y="411" width="106" height="16" class="bg"/><text x="592.0" y="424" class="t-i mid">waiting entries</text><path d="M432,436 L750,436" class="a a-gray" marker-end="url(#d12-gray)"/><circle cx="456" cy="436" r="9" class="f-violet"/><text x="456" y="440" class="t-i mid w6">4</text><text x="672.0" y="458" class="t-i mid">hook context:</text><text x="672.0" y="472" class="t-i mid">framed batch,</text><text x="672.0" y="486" class="t-i mid">quoted bodies</text><path d="M752,500 L594,500" class="a a-ink" marker-end="url(#d12-ink)"/><circle cx="728" cy="500" r="9" class="f-violet"/><text x="728" y="504" class="t-i mid w6">5</text><path d="M32,522 L828,522" class="bound"/><text x="44" y="542" class="t-h x-muted">else</text><text x="84" y="542" class="t-i">idle session, waking kind, 45 s with no hook run</text><rect x="327" y="555" width="208" height="30" class="bg"/><text x="432.0" y="568" class="t-i mid">channel event: one summary line</text><text x="432.0" y="582" class="t-i mid">("1 message from alice (task)")</text><path d="M272,596 L590,596" class="a a-ink" marker-end="url(#d12-ink)"/><circle cx="296" cy="596" r="9" class="f-violet"/><text x="296" y="600" class="t-i mid w6">6</text><rect x="522.0" y="610" width="140" height="28" rx="8" class="f-amber"/><text x="534.0" y="630" class="t-i">a new turn starts</text><text x="672.0" y="660" class="t-i mid">UserPromptSubmit</text><text x="672.0" y="674" class="t-i mid">hook input</text><path d="M592,688 L750,688" class="a a-ink" marker-end="url(#d12-ink)"/><circle cx="616" cy="688" r="9" class="f-violet"/><text x="616" y="692" class="t-i mid w6">7</text><rect x="539" y="703" width="106" height="16" class="bg"/><text x="592.0" y="716" class="t-i mid">waiting entries</text><path d="M432,728 L750,728" class="a a-gray" marker-end="url(#d12-gray)"/><circle cx="456" cy="728" r="9" class="f-violet"/><text x="456" y="732" class="t-i mid w6">8</text><text x="672.0" y="750" class="t-i mid">hook context:</text><text x="672.0" y="764" class="t-i mid">framed batch</text><path d="M752,778 L594,778" class="a a-ink" marker-end="url(#d12-ink)"/><circle cx="728" cy="778" r="9" class="f-violet"/><text x="728" y="782" class="t-i mid w6">9</text><rect x="539" y="813" width="106" height="16" class="bg"/><text x="592.0" y="826" class="t-i mid">mark drained/42</text><path d="M752,838 L434,838" class="a a-gray" marker-end="url(#d12-gray)"/><circle cx="728" cy="838" r="9" class="f-violet"/><text x="728" y="842" class="t-i mid w6">10</text><text x="352.0" y="858" class="t-i mid">drained mark seen</text><text x="352.0" y="872" class="t-i mid">(checked every 250 ms)</text><path d="M432,886 L274,886" class="a a-gray" marker-end="url(#d12-gray)"/><circle cx="408" cy="886" r="9" class="f-violet"/><text x="408" y="890" class="t-i mid w6">11</text><text x="192.0" y="906" class="t-i mid">acknowledge #42</text><path d="M272,918 L114,918" class="a a-teal" marker-end="url(#d12-teal)"/><circle cx="248" cy="918" r="9" class="f-violet"/><text x="248" y="922" class="t-i mid w6">12</text><text x="32" y="968" class="t-cap">Numbers give the order of messages. The frame shows two alternative paths.</text></svg>

name: Bug report
description: Something in mash does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a suspected security problem, do not use this form: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: mash version
      description: The output of `mash version`.
      placeholder: "mash 0.3.0 (commit abc1234)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 arm64, Ubuntu 24.04 amd64"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - go install
        - Release binary
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Steps to reproduce, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output or logs. Remove NATS credentials (.creds contents), seeds and tokens before pasting.
      render: shell

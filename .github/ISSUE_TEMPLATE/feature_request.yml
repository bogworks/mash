name: Feature request
description: Suggest an improvement to mash
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like mash to do. Alternatives you considered are welcome.
    validations:
      required: true

name: lint
# A docs-only pull request skips the work at job level (the changes job, scripts/ci-changes): the lint check still reports,
# as skipped. No workflow-level paths filter: a required check that never reports stalls the merge queue.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.27.4
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Does this change need the work? scripts/ci-changes decides (see ci.yml; run from the base revision, and a diff touching
  # .github/ or scripts/ci-changes is always code, as hardening): only a docs-only pull request skips. A push
  # and a schedule always run. The check names stay: a skipped job reports as skipped.
  changes:
    timeout-minutes: 5
    runs-on: [self-hosted, rh-gate]
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --no-renames --name-only "$BASE" HEAD)"
            # Hardening: a diff touching .github/ or the classifier is always code, whatever the classifier says.
            if grep -qE '^"?(\.github/|scripts/ci-changes"?$)' <<<"$files"; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Hardening: the classifier comes from the base revision, not the pull request's. No copy there: code.
            if git show "$BASE:scripts/ci-changes" > "$RUNNER_TEMP/ci-changes"; then
              bash "$RUNNER_TEMP/ci-changes" <<<"$files" >> "$GITHUB_OUTPUT"
            else
              echo "code=true" >> "$GITHUB_OUTPUT"
            fi
          else
            bash scripts/ci-changes <<<"$files" >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: lint
    # Skipped only when changes says docs-only; !cancelled() runs it when changes itself failed (fail closed).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go caches
        run: if [ -f scripts/ci-go-caches ]; then scripts/ci-go-caches check; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt reports nothing
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:" >&2; echo "$out" >&2; exit 1; fi
      - run: go vet ./...
      - name: change-log fragments are well formed
        run: go run ./scripts/changelog check
      # TEMPORARY: the tree has 3 existing findings (SA4006 x2, ST1008 in internal/endpoint/endpoint_test.go), so this
      # step lists them without failing the job. Remove continue-on-error once they are fixed.
      - name: staticcheck
        continue-on-error: true
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

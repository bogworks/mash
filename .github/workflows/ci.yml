name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.27.3
jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
  # The release gate (scripts/release-check) requires a check run named "reproducible" on the candidate: X built from
  # two fresh clones in different directories must give identical bytes, so a change that breaks reproducibility
  # fails here, before a tag does.
  reproducible:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build twice in fresh clones and compare
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/buildrelease" ./scripts/buildrelease
          for n in a b; do
            src="$RUNNER_TEMP/clone-$n/src"
            mkdir -p "$(dirname "$src")"
            git clone -q "$GITHUB_WORKSPACE" "$src"
            git -C "$src" checkout -q "$GITHUB_SHA"
            "$RUNNER_TEMP/buildrelease" -src "$src" -out "$RUNNER_TEMP/out-$n/mash" \
              -version 0.0.0-ci -commit "$GITHUB_SHA" | tee "$RUNNER_TEMP/sum-$n"
          done
          a="$(cut -d' ' -f1 "$RUNNER_TEMP/sum-a")"
          b="$(cut -d' ' -f1 "$RUNNER_TEMP/sum-b")"
          [ "$a" = "$b" ] || { echo "not reproducible: $a vs $b" >&2; exit 1; }
          [ "$("$RUNNER_TEMP/out-a/mash" version)" = "mash 0.0.0-ci (commit $GITHUB_SHA)" ]

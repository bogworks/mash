name: ci
# Every push to main runs the test matrix, docs-only too: the release gate reads main's test runs, and a docs-only
# head would otherwise have none and be refused (v0.2.1 had to be tagged one commit back). Every job runs on a
# self-hosted runner picked by literal labels: [self-hosted, rh-linux] or [self-hosted, rh-macos] (ADR 0079). A pull
# request from a fork runs on them too; the repository holds an outside contributor's run for a person's approval. Every pull request runs, so it always gets the pr-check that its review waits for (scripts/review-pr); a docs-only one skips the test matrix.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.27.3
# A new push to a pull request supersedes its older run; a run on main is never cancelled (the release gate reads
# main's check runs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Does this pull request touch code? A push always counts as code: the release gate reads main's test runs.
  changes:
    timeout-minutes: 5
    runs-on: [self-hosted, rh-linux]
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only "$BASE" HEAD)"
            # Not piped into grep -q: an early grep exit would fail the diff under pipefail.
            if ! grep -qvE '^docs/|\.md$' <<<"$files"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  test:
    # No name: the matrix os values (linux, macos) make the check names test (linux) and test (macos).
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false # one OS failing must not cancel the other and hide its result
      matrix:
        include:
          - {os: linux, runs-on: [self-hosted, rh-linux]}
          - {os: macos, runs-on: [self-hosted, rh-macos]}
    # The macOS runner takes one job at a time; a queued macOS job waits and the wait is accepted (ADR 0079).
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Keep every Go cache and temp dir under RUNNER_TEMP, which is wiped below (the self-hosted runner is reused between jobs).
      - name: Job-local Go and temp dirs (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/go" "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomod" "$RUNNER_TEMP/tmp"
          {
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomod"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: ${{ matrix.os != 'macos' }}
      - run: go vet ./...
      # -timeout 20m: under -race, scripts/releasecheck takes about 150 s on a Linux runner and about 4x that on the
      # macOS runner (2 vCPU, Intel x64), past go test's default 10 m (run 41292329623). A real hang still fails.
      - name: go test
        env:
          # The words internal to the maintainers, from a repository variable (data through env): the standalone
          # source scan in cmd/mash fails on any of them.
          MASH_FORBIDDEN_WORDS: ${{ vars.MASH_FORBIDDEN_WORDS }}
        run: |
          set -eu
          if [ "$RUNNER_OS" = macOS ]; then
            # scripts/releasecheck builds release binaries and takes about 440 s even without -race, a third of the
            # job's wall time on the 2-vCPU macOS runner (#275); Linux runs it, with -race, on every event.
            go test -race -timeout 20m $(go list ./... | grep -v '/scripts/releasecheck$')
          else
            go test -race -timeout 20m ./...
          fi
      - name: Leave nothing behind (macOS)
        if: always() && matrix.os == 'macos'
        run: |
          # Go's module cache is read-only, so make it writable before removing it.
          chmod -R u+w "$RUNNER_TEMP" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/go" "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gomod" "$RUNNER_TEMP/tmp"
          rm -rf "$RUNNER_TOOL_CACHE/go"
          git clean -ffdx || true
  # The release gate (scripts/release-check, release.RequiredChecks) requires a check run named exactly "reproducible"
  # on the candidate, so the name is explicit and the job is neither conditional nor matrixed: every release target
  # built from two fresh clones in different directories must give identical bytes, so a change that breaks
  # reproducibility fails here, before a tag does.
  reproducible:
    name: reproducible
    timeout-minutes: 30
    # Same runner as the other Linux jobs; a fork pull request runs on it too.
    # This is the release-facing check (codex H1 on #39).
    runs-on: [self-hosted, rh-linux]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build every release target twice in fresh clones and compare
        run: |
          set -euo pipefail
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            scripts/build-twice "${t%/*}" "${t#*/}" 0.0.0-ci "$GITHUB_SHA" "$RUNNER_TEMP/out/mash-${t%/*}-${t#*/}"
          done
      - name: The binary reports its version and commit
        run: |
          set -euo pipefail
          got="$("$RUNNER_TEMP/out/mash-linux-amd64" version)"
          want="mash 0.0.0-ci (commit $GITHUB_SHA)"
          if [ "$got" != "$want" ]; then echo "mash version printed '$got', expected '$want'" >&2; exit 1; fi
  # conformance: the fast static slice (build, vet, gofmt, tidy, staticcheck) that the review watcher waits for before it
  # starts a Codex review, so review rounds do not wait for the test matrix (every step here is also covered by the
  # jobs above or by lint.yml). It runs on pull_request events only, never on a merge queue's branches, and is NOT in
  # pr-check's needs and not a Mergify condition: it only gates when a review starts, not whether a pull request merges.
  conformance:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/')
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt reports nothing
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:" >&2; echo "$out" >&2; exit 1; fi
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # As in lint.yml: existing findings are listed without failing until they are fixed.
      - name: staticcheck
        continue-on-error: true
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
  # ADR numbers: docs/decisions/NEXT names the next free number and no two records share one (ADR 0070). It runs on every
  # event and on the checked-out tree, which for Mergify's queue run is the combined commit (a pull_request run on the
  # queue's merge of the pull requests ahead). Two pull requests that take the same number bump NEXT to the same value,
  # git merges that cleanly, and neither pull request's own run sees the other's record: only a check on the combined
  # commit catches the duplicate. merge_group is also a trigger so a GitHub merge queue gets the same check.
  adr-numbers:
    timeout-minutes: 5
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./scripts/adrlint docs
  # The one check scripts/review-pr waits for before a Codex review: it passes only if every job above passed (test
  # may skip a pull request that touches no code). always(), so a failed or skipped job still gives a verdict.
  pr-check:
    needs: [changes, test, reproducible, adr-numbers]
    if: always()
    timeout-minutes: 5
    runs-on: [self-hosted, rh-linux]
    steps:
      - name: Every required job passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
          REPRO: ${{ needs.reproducible.result }}
          ADR: ${{ needs.adr-numbers.result }}
        run: |
          set -eu
          echo "changes: code=$CODE; test: $TEST; reproducible: $REPRO; adr-numbers: $ADR"
          [ "$REPRO" = success ] || { echo "reproducible: $REPRO" >&2; exit 1; }
          [ "$ADR" = success ] || { echo "adr-numbers: $ADR" >&2; exit 1; }
          case "$CODE/$TEST" in
            */success | false/skipped) ;;
            *) echo "test: $TEST (code changed: $CODE)" >&2; exit 1 ;;
          esac

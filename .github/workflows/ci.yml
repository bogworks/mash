name: ci
# A push to main skips the heavy jobs when the paths it added are docs-only (scripts/ci-changes; the merge queue's fast-forward of
# a docs-only batch is one): the release gate (internal/release CheckCIWalk) judges such a head by the newest commit below
# it whose tests ran, provided every commit between is docs-only. Every job runs on a
# self-hosted runner picked by literal labels: [self-hosted, rh-linux] or [self-hosted, rh-gate] (ADR 0079; the macOS leg runs in release.yml on tags, the eph pilot in nightly.yml, rule 21 and ADR 0160). A pull
# request from a fork runs on them too; the repository holds an outside contributor's run for a person's approval. Every pull request runs, so it always gets the pr-check that its review waits for (scripts/review-pr); a docs-only one skips the heavy jobs (test, reproducible, conformance) at job level, so every check name still reports, and runs the cheap ones (changes, adr-numbers, pr-check). The review watcher waits only on pr-check, so conformance, which gates nothing, is skipped on docs-only too. What counts as docs-only is in scripts/ci-changes; docs/branch-protection.md states the rule. The macOS test job is advisory (ADR 0079), and so is the eph one: both run only on a Mergify queue draft (head branch mergify/...), not on every pull request push (Randy 2026-11-21).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.27.4
# A new push to a pull request supersedes its older run; a run on main is never cancelled (the release gate reads
# main's check runs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Does this change need the heavy jobs? scripts/ci-changes decides (it has the definition of code), run from the base
  # revision rather than the pull request's (hardening); a diff touching .github/ or scripts/ci-changes is always code. A pull request that
  # touches only documentation (Markdown anywhere, anything under docs/) is docs-only (code=false). A Mergify merge-queue draft
  # is classified by its diff against main, which is the whole batch (docs-only only when every queued pull request is), and
  # a push by the paths it added. A merge group and a schedule always count as code. The heavy jobs skip on code=false at job level; the check names stay, a skipped job reports as skipped.
  changes:
    timeout-minutes: 5
    runs-on: [self-hosted, rh-gate]
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = push ] && [ -n "${REPO:-}" ] && [ -n "${GITHUB_SHA:-}" ] && command -v gh >/dev/null 2>&1; then
            # The merge queue fast-forwards main to the exact commit its draft already tested: when a Mergify draft's ci run
            # on this very SHA has a passed pr-check, the push runs nothing again (code=false). The release gate takes the newest
            # run that tested per required check on the commit, so the draft's passed test (linux) and reproducible still stand
            # and the push's skipped runs hide nothing (internal/release evaluate). Any API failure or doubt: code is decided as before.
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$GITHUB_SHA&event=pull_request&per_page=100" --jq '[.workflow_runs[] | select(.name == "ci" and (.head_branch | startswith("mergify/"))) | .id] | .[]' 2>/dev/null || true)"
            for id in $runs; do
              if [ "$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "pr-check" and .conclusion == "success")] | length' 2>/dev/null || echo 0)" -gt 0 ]; then
                echo "queue run $id already tested $GITHUB_SHA with a passed pr-check"
                echo "code=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            if [ "$EVENT" = push ]; then
              # A push to main (the merge queue's fast-forward of a batch, or a direct push): what the push added. No usable
              # previous head (a new branch, a force push) is code.
              BASE="$BEFORE"
              if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                echo "code=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            files="$(git diff --no-renames --name-only "$BASE" HEAD)"
            # Hardening: a diff touching .github/ or the classifier is always code, whatever the classifier says.
            if grep -qE '^"?(\.github/|scripts/ci-changes"?$)' <<<"$files"; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Hardening: the classifier comes from the base revision, not the pull request's. No copy there: code.
            if git show "$BASE:scripts/ci-changes" > "$RUNNER_TEMP/ci-changes"; then
              bash "$RUNNER_TEMP/ci-changes" <<<"$files" >> "$GITHUB_OUTPUT"
            else
              echo "code=true" >> "$GITHUB_OUTPUT"
            fi
          else
            bash scripts/ci-changes <<<"$files" >> "$GITHUB_OUTPUT"
          fi
  test:
    # The name is explicit and the job is not matrixed: the check name is exactly test (linux), a required check
    # (release.RequiredChecks).
    name: test (linux)
    needs: changes
    # A heavy job: skipped only when changes says docs-only (code=false). !cancelled() lets it run when changes itself
    # failed (the output is then empty, not false), so a broken classifier runs the work rather than skipping it; pr-check
    # fails on a changes job that did not succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 45
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-test
        with:
          forbidden-words: ${{ vars.MASH_FORBIDDEN_WORDS }}
  # Rule 21 (dev-process 0.8.x, Randy 2026-11-21): test (macos) runs on tagged releases only (release.yml) and test (linux, eph) nightly on main
  # (nightly.yml); neither runs per change. docs/ci-table.md is the one table, pinned by internal/release/ci_table_test.go.
  # The release gate (scripts/release-check, release.RequiredChecks) requires a check run named exactly "reproducible"
  # on the candidate, so the name is explicit and the job is not matrixed. The candidate is a commit on main, which a push
  # Runs on a queue draft and on a push, not on an ordinary pull request push (Randy 2026-11-21: the queue tests the batch once; the release gate
  # finds the draft's passed run on the commit main fast-forwards to). The skips: a docs-only change (job-level, as test) and an ordinary pull request push: every release target
  # built from two fresh clones in different directories must give identical bytes, so a change that breaks
  # reproducibility fails here, before a tag does.
  reproducible:
    name: reproducible
    needs: changes
    # A heavy job: skipped only when changes says docs-only (code=false). !cancelled() lets it run when changes itself
    # failed (the output is then empty, not false), so a broken classifier runs the work rather than skipping it; pr-check
    # fails on a changes job that did not succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/')) }}
    timeout-minutes: 30
    # Same runner as the other Linux jobs; a fork pull request runs on it too.
    # This is the release-facing check (codex H1 on #39).
    runs-on: [self-hosted, rh-linux]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build every release target twice in fresh clones and compare
        run: |
          set -euo pipefail
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            scripts/build-twice "${t%/*}" "${t#*/}" 0.0.0-ci "$GITHUB_SHA" "$RUNNER_TEMP/out/mash-${t%/*}-${t#*/}"
          done
      - name: The binary reports its version and commit
        run: |
          set -euo pipefail
          got="$("$RUNNER_TEMP/out/mash-linux-amd64" version)"
          want="mash v0.0.0-ci (${GITHUB_SHA:0:7})"
          if [ "$got" != "$want" ]; then echo "mash version printed '$got', expected '$want'" >&2; exit 1; fi
  # conformance: the fast static slice (build, vet, gofmt, tidy, staticcheck) that the review watcher waits for before it
  # starts a Codex review, so review rounds do not wait for the test matrix (every step here is also covered by the
  # jobs above or by lint.yml). It runs on pull_request events only, never on a merge queue's branches, and is NOT in
  # pr-check's needs and not a Mergify condition: it gates nothing. A docs-only pull request skips it (job-level if on the changes
  # output; the review watcher waits only on pr-check), and a Mergify draft never runs it.
  conformance:
    needs: changes
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/') && needs.changes.outputs.code != 'false'
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go caches
        run: if [ -f scripts/ci-go-caches ]; then scripts/ci-go-caches check; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt reports nothing
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:" >&2; echo "$out" >&2; exit 1; fi
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # As in lint.yml: existing findings are listed without failing until they are fixed.
      - name: staticcheck
        continue-on-error: true
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
  # ADR numbers: no two records share a number on the checked-out tree, which for Mergify's queue run is the combined
  # commit (a pull_request run on the queue's merge of the pull requests ahead); there is no counter file (ADR 0089). It
  # runs on every event. Two pull requests that take the same number each pass alone, git merges them cleanly, and
  # only the combined commit shows the duplicate. merge_group is also a trigger so a GitHub merge queue gets the same
  # check.
  adr-numbers:
    timeout-minutes: 5
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./scripts/adrlint docs
  # The one check a docs-only change needs (Randy 2026-11-21: "as long as they properly conform to their syntax, I don't see why
  # anything else needs to run"): every tracked Markdown file has closed code fences and relative links that resolve
  # (scripts/doclint). It runs on every change and takes seconds. Pull requests, the merge queue's drafts and pushes to
  # main all run it, and pr-check needs it.
  docs-lint:
    timeout-minutes: 5
    # A gate job (ADR 0086): on the small gate runners, so a docs-only pull request never waits behind the test jobs for a runner.
    # Gate runners also run label-reset with a label-edit token, so nothing from the pull request is built or run here: the linter is
    # built from the BASE revision (a second checkout; main itself on a push) and the pull request's checkout is only its input.
    # The pull request that adds scripts/doclint has no linter on its base: the step says so and passes (a later change to the
    # linter is a change under scripts/, which is code and gets the full review).
    runs-on: [self-hosted, rh-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: base/go.mod
          cache: false
      - name: Lint the Markdown with the base revision's linter
        run: |
          set -euo pipefail
          if [ -d base/scripts/doclint ]; then
            (cd base && go build -o "$RUNNER_TEMP/doclint" ./scripts/doclint)
            "$RUNNER_TEMP/doclint" --root pr
          else
            echo "the base revision has no scripts/doclint (the pull request that adds it): nothing to run it with"
          fi
  # The one check scripts/review-pr waits for before a Codex review: it passes only if every job above passed. A heavy job
  # (test, reproducible) may be skipped only when changes succeeded and said code=false (a docs-only pull request); a
  # skip with code=true or with no answer, a failure and a cancellation all fail it. always(), so a failed or skipped job
  # still gives a verdict.
  pr-check:
    needs: [changes, test, reproducible, adr-numbers, docs-lint]
    if: always()
    timeout-minutes: 5
    runs-on: [self-hosted, rh-gate]
    steps:
      - name: Every required job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
          REPRO: ${{ needs.reproducible.result }}
          ADR: ${{ needs.adr-numbers.result }}
          DOCS: ${{ needs.docs-lint.result }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ startsWith(github.head_ref, 'mergify/') }}
        run: |
          set -eu
          echo "changes: $CHANGES, code=$CODE; test: $TEST; reproducible: $REPRO; adr-numbers: $ADR; docs-lint: $DOCS"
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES" >&2; exit 1; }
          [ "$ADR" = success ] || { echo "adr-numbers: $ADR" >&2; exit 1; }
          [ "$DOCS" = success ] || { echo "docs-lint: $DOCS" >&2; exit 1; }
          # A heavy job passed when it succeeded, or when it was skipped on a docs-only pull request (code=false).
          for job in test:"$TEST" reproducible:"$REPRO"; do
            case "$CODE/${job#*:}" in
              */success | false/skipped) ;;
              # reproducible runs on a queue draft and a push, not on an ordinary pull request push: skipped there is a pass.
              true/skipped) if [ "${job%%:*}" = reproducible ] && [ "${EVENT:-}" = pull_request ] && [ "${DRAFT:-}" = false ]; then :; else echo "${job%%:*}: ${job#*:} (code changed: $CODE)" >&2; exit 1; fi ;;
              *) echo "${job%%:*}: ${job#*:} (code changed: $CODE)" >&2; exit 1 ;;
            esac
          done

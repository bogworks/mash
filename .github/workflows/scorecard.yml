name: Scorecard
# OpenSSF Scorecard (ADR 0189). The one workflow that runs on a GitHub-hosted runner, an exception to
# ADR 0079: publish_results needs OIDC on a GitHub-hosted runner to publish to the OpenSSF API. It runs only on the weekly
# schedule and on a push to main, never on a pull request, so no pull-request code reaches this runner. Forks skip.
on:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: results.sarif

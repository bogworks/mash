name: release
# Runs on a signed tag v<N.N.N> that the maintainer pushes at the candidate commit X after scripts/release-check passed. It
# builds every target twice, in two fresh clones in different directories, and fails unless the two SHA-256s match.
# It publishes a DRAFT release, then re-checks release order (scripts/draft-guard --after-create) and fails, leaving its draft in place
# for manual resolution, if a lower draft or a higher published release stands beside it; the maintainer runs `scripts/release-check --assets <version> <X>` (tag signature, tag at X,
# exactly our builds attached) before publishing. Every job runs on a self-hosted runner,
# [self-hosted, rh-linux] (ADR 0079); a tag push is never a fork pull request.
# Besides the four binaries a release carries a CycloneDX SBOM per binary (mash-<os>-<arch>.cdx.json, attested with
# actions/attest-sbom) and build provenance for the four binaries (mash.intoto.jsonl, the Sigstore bundle of the
# actions/attest-build-provenance attestation the attest job makes in-job, on our self-hosted runner: no reusable workflow
# of another repository is called, ADR 0079); mash meets SLSA v1.0 Build L2, not L3 (ADR 0051). `release-check --assets`
# verifies all of it before the maintainer signs SHA256SUMS.
# A workflow_dispatch run on main is a DRY RUN (docs/release.md, "Dry run"): it builds, makes the SBOMs, attests and makes
# the provenance exactly as a tag does, then the dry-run-verify job verifies all of it. It has no guard, no draft, no
# release, no tag and uploads nothing to a release; its version is 0.0.0-dryrun and its commit is the dispatched HEAD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # one tag, one release build; never abandon a build half way
env:
  GOTOOLCHAIN: go1.27.4
  CGO_ENABLED: "0"
  # What the build and the SBOMs are named after and made at: the pushed tag and its commit; on a dry run, a plainly
  # non-release version and the dispatched HEAD. Nothing else in this workflow reads the tag from the ref.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dryrun' }}
  RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || 'HEAD' }}
jobs:
  guard:
    if: ${{ github.event_name == 'push' }} # a dry run has no tag to judge
    timeout-minutes: 10
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: write # `gh release list` shows drafts only to a token that can write; this job never writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is v<N.N.N>, annotated, and carries a signature
        # Shape, not validity: the runner holds no key. It stops a malformed name, a lightweight tag or a plainly
        # unsigned one from producing a draft; `release-check --assets` runs `git verify-tag` with the maintainer's keyring.
        run: |
          # In an `if`, not bare: bash 3.2 (macOS, where the tests run this script) does not stop `set -e` on a lone [[ ]].
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "not a version tag: $GITHUB_REF_NAME" >&2; exit 1; fi
          # actions/checkout writes the pushed tag as a lightweight ref to its commit (v0.1.1's run failed here), so
          # the tag object itself is fetched from origin before it is judged.
          git fetch -q --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]
          git cat-file tag "$GITHUB_REF_NAME" | grep -q -e '-----BEGIN PGP SIGNATURE-----' -e '-----BEGIN SSH SIGNATURE-----'
      - name: The candidate is on main
        # The commit comes from the tag: what GITHUB_SHA holds on an annotated-tag push (commit or tag object) is not
        # relied on anywhere in this workflow.
        run: git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" origin/main
      - name: No older draft release is left behind
        # An unpublished older draft stops this one: publish or delete it first. Needs jq (on GitHub runners).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          scripts/draft-guard "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases.json"
  build:
    # On a tag push the guard must have succeeded. On a dispatch the guard is skipped (a skipped needed job skips its
    # dependents unless the condition says otherwise), so a dispatch on main builds anyway, and on any other ref nothing
    # builds, which skips every job below too. !cancelled() keeps a failed guard (not skipped) from running the build.
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.guard.result == 'skipped')) }}
    timeout-minutes: 30
    runs-on: [self-hosted, rh-linux]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build twice in fresh clones and compare
        env:
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          name="mash-${GOOS_T}-${GOARCH_T}"
          scripts/build-twice "$GOOS_T" "$GOARCH_T" "$version" "$commit" "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mash-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
  draft:
    # A draft exists only once the provenance, the SBOMs and their attestations do, so publishing can never precede or outlive a
    # failed attestation.
    # Attestation requires a public repository (or GitHub Enterprise Cloud); this repository is public.
    needs: [build, attest, sbom, attest-sbom]
    # An explicit status function: a skipped guard (a dry run) would otherwise skip every job downstream of build. On a push
    # the guard succeeds and every need must have succeeded.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && needs.attest.result == 'success' && needs.sbom.result == 'success' && needs['attest-sbom'].result == 'success' }} # never on a dry run: it creates the release
    timeout-minutes: 30
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          # The quickstart script travels as a release asset, so the README can fetch it from the tag and check it.
          [ -f scripts/quickstart-synadia.sh ] || { echo "scripts/quickstart-synadia.sh is missing at $GITHUB_REF_NAME" >&2; exit 1; }
          cp -p scripts/quickstart-synadia.sh dist/quickstart-synadia.sh
          # The maintainer's signature on SHA256SUMS covers every asset: the binaries, the script, the SBOMs and the
          # build provenance. Named, not globbed, so a missing file fails here and a stray one is never listed.
          (cd dist && sha256sum \
            mash-darwin-amd64 mash-darwin-arm64 mash-linux-amd64 mash-linux-arm64 \
            quickstart-synadia.sh \
            mash-darwin-amd64.cdx.json mash-darwin-arm64.cdx.json mash-linux-amd64.cdx.json mash-linux-arm64.cdx.json \
            mash.intoto.jsonl > SHA256SUMS)
          # The base is the highest PUBLISHED release that is an ancestor of the commit, not the last tag: commits of
          # an unpublished tag belong in these notes. None (the first release) means the whole history.
          gh release list --limit 200 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          prev="$(scripts/notes-base "$GITHUB_REF_NAME" "$commit" "$RUNNER_TEMP/releases.json")"
          if [ -n "$prev" ]; then
            range="$prev..$commit"
          else
            range="$commit"
          fi
          { echo "# $GITHUB_REF_NAME"; echo; git log --no-merges --format='- %s (%h)' "$range"; } > dist/CHANGELOG.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/CHANGELOG.md \
            dist/mash-darwin-amd64 dist/mash-darwin-arm64 dist/mash-linux-amd64 dist/mash-linux-arm64 \
            dist/mash-darwin-amd64.cdx.json dist/mash-darwin-arm64.cdx.json dist/mash-linux-amd64.cdx.json dist/mash-linux-arm64.cdx.json \
            dist/mash.intoto.jsonl dist/quickstart-synadia.sh dist/SHA256SUMS
          # The guard job's check and this creation are not atomic, and the concurrency group is per tag, so two tags'
          # runs can both pass the guard. Re-check now that the draft exists: a lower draft or a higher published
          # release makes THIS run fail, naming it. The guard never deletes: the draft stays for the maintainer to resolve
          # (`gh release delete <tag>` after checking its state, or publish the lower one first, then rerun; ADR 0001, rule 5).
          scripts/draft-guard --after-create "$GITHUB_REF_NAME"
  attest:
    # Build provenance for the four binaries, made in-job on the self-hosted runner that holds them: actions/attest-build-provenance
    # signs with this workflow's own identity, so no reusable workflow of another repository runs (ADR 0079). The Sigstore
    # bundle it writes is kept as mash.intoto.jsonl, which the draft job attaches and SHA256SUMS covers. The three permissions
    # belong to this job only.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      id-token: write # the OIDC token the attestation is signed with
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mash-* # the binaries only: never an SBOM artifact (sbom-*) another job may already have uploaded
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        # Provenance for the four binaries (what consumers download); SHA256SUMS is a derived listing, not a subject.
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mash-*
      - name: Keep the provenance bundle as mash.intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ "$(find dist -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l | tr -d ' ')" = 4 ] || { echo "dist does not hold exactly the four binaries" >&2; ls dist >&2; exit 1; }
          [ -s "$BUNDLE" ] || { echo "the attestation wrote no bundle" >&2; exit 1; }
          mkdir -p provenance
          cp "$BUNDLE" provenance/mash.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/mash.intoto.jsonl
          if-no-files-found: error
  sbom:
    # One CycloneDX 1.5 SBOM per binary, made from the built binary itself (its embedded module list), so it describes
    # exactly the bytes a consumer downloads. The tool version is pinned; the job reads and uploads, nothing else.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mash-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: SBOM of the binary
        env:
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          name="mash-${GOOS_T}-${GOARCH_T}"
          chmod +x "dist/$name" # artifact downloads drop the mode; the tool reads the build info of an executable
          "$RUNNER_TEMP/tools/cyclonedx-gomod" bin -json -output-version 1.5 -version "$RELEASE_TAG" -output "dist/$name.cdx.json" "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
          if-no-files-found: error
  attest-sbom:
    needs: sbom
    if: ${{ !cancelled() && needs.sbom.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      id-token: write # the OIDC token the attestation is signed with
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mash-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Attest the SBOM, with the binary as its subject
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}
          sbom-path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
  dry-run-verify:
    # The dry run's verdict: everything the release gate checks about the attestations and provenance, here, with nothing
    # published. Only a dispatch on main runs it; on a tag push the draft job takes its place. It reads and verifies, and
    # holds no id-token.
    needs: [build, attest, sbom, attest-sbom]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.attest.result == 'success' && needs.sbom.result == 'success' && needs['attest-sbom'].result == 'success' }}
    timeout-minutes: 20
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist # the four binaries, the four SBOMs and mash.intoto.jsonl
          merge-multiple: true
      - name: Verify the build provenance, the build attestations and the SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          [ -f mash.intoto.jsonl ] || { echo "no mash.intoto.jsonl was downloaded" >&2; ls >&2; exit 1; }
          # The workflow that made the provenance must be release.yml: every line (a Sigstore bundle, or a bare DSSE envelope) of the
          # provenance names it as its entry point (SLSA v0.2 configSource.entryPoint, or v1 externalParameters.workflow.path).
          jq -r '(.dsseEnvelope.payload // .payload)' mash.intoto.jsonl | while read -r p; do
            echo "$p" | base64 -d | jq -e '(.predicate.invocation.configSource.entryPoint // .predicate.buildDefinition.externalParameters.workflow.path) == ".github/workflows/release.yml"' > /dev/null \
              || { echo "mash.intoto.jsonl was not made by .github/workflows/release.yml" >&2; exit 1; }
          done
          for n in mash-linux-amd64 mash-linux-arm64 mash-darwin-amd64 mash-darwin-arm64; do
            echo "== $n"
            # The provenance was made from a branch ref (main), not a tag, so no source tag applies: the signer workflow and
            # source ref pin it. The attached bundle must verify offline for this binary, as must the attestation GitHub holds.
            gh attestation verify "$n" -R "${{ github.repository }}" --bundle mash.intoto.jsonl --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main
            gh attestation verify "$n" -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main
            gh attestation verify "$n" -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --predicate-type https://cyclonedx.org/bom --format json > "$RUNNER_TEMP/$n.sbom-verify.json"
            # actions/attest-sbom stores the SBOM verbatim as the predicate: a verified statement about THIS binary must
            # carry exactly the attached .cdx.json (`jq -S` sorts keys, so only content is compared).
            sum="$(sha256sum "$n" | cut -d' ' -f1)"
            jq -S --arg sum "$sum" '[.[].verificationResult.statement | select(any(.subject[]; .digest.sha256 == $sum)) | .predicate] | first' \
              "$RUNNER_TEMP/$n.sbom-verify.json" > "$RUNNER_TEMP/$n.predicate.json"
            jq -S . "$n.cdx.json" > "$RUNNER_TEMP/$n.sbom.json"
            if ! cmp -s "$RUNNER_TEMP/$n.predicate.json" "$RUNNER_TEMP/$n.sbom.json"; then
              echo "the verified SBOM attestation for $n does not carry $n.cdx.json" >&2
              exit 1
            fi
          done

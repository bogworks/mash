name: release
# Runs on a tag v<N.N.N> at the candidate commit X, after scripts/release-check passed. The tag is pushed either by the maintainer
# (below the cutover version in docs/release-cutover: annotated and SSH-signed) or by the minting service with a deploy key
# (at or above it: annotated and unsigned; keyless); the `push: tags` trigger is the same for both. It builds every target twice,
# in two fresh clones in different directories, and fails unless the two SHA-256s match.
# It publishes a DRAFT release, then re-checks release order (scripts/draft-guard --after-create) and fails, leaving its draft in place
# for manual resolution, if a lower draft or a higher published release stands beside it; the maintainer runs `scripts/release-check --assets <version> <X>` (tag at X, the tag
# signature below the cutover, exactly our builds attached) before publishing. Every job runs on a self-hosted runner,
# [self-hosted, rh-linux] (ADR 0079); a tag push is never a fork pull request.
# Besides the eight binaries (mash and mashctl for each target) a release carries the two scripts install.sh and mash-local-nats-setup.sh
# (the repository's scripts/ files at the tagged commit, copied unchanged; ADR 0150), a CycloneDX SBOM per binary (<program>-<os>-<arch>.cdx.json, attested with
# actions/attest-sbom; the scripts have none), SHA256SUMS (made by the sums job before the attestation and attested with the binaries) and build
# provenance for the binaries, the scripts and SHA256SUMS (mash.intoto.jsonl, the Sigstore bundle of the
# actions/attest-build-provenance attestation the attest job makes in-job, on our self-hosted runner: no reusable workflow
# of another repository is called, ADR 0079); mash meets SLSA Build L2, not L3 (ADR 0051). `release-check --assets`
# verifies all of it. Below the cutover the maintainer also signs SHA256SUMS; at or above it the attestation is the proof.
# A workflow_dispatch run on main is a DRY RUN (docs/release.md, "Dry run"): it builds, makes the SBOMs and SHA256SUMS, attests and makes
# the provenance exactly as a tag does, then the dry-run-verify job verifies all of it. It has no guard, no draft, no
# release, no tag and uploads nothing to a release; its version is 0.0.0-dryrun and its commit is the dispatched HEAD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # one tag, one release build; never abandon a build half way
env:
  GOTOOLCHAIN: go1.27.4
  CGO_ENABLED: "0"
  # What the build and the SBOMs are named after and made at: the pushed tag and its commit; on a dry run, a plainly
  # non-release version and the dispatched HEAD. Nothing else in this workflow reads the tag from the ref.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dryrun' }}
  RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || 'HEAD' }}
jobs:
  guard:
    if: ${{ github.event_name == 'push' }} # a dry run has no tag to judge
    timeout-minutes: 10
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: write # `gh release list` shows drafts only to a token that can write; this job never writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is v<N.N.N>, annotated, and (below the cutover, or from signed-from) carries a signature
        # Shape, not validity: the runner holds no key. It stops a malformed name or a lightweight tag from producing a draft.
        # Below the cutover version (docs/release-cutover at the tag's commit) it also stops a plainly unsigned tag; at or
        # above it the tag is unsigned by design (the minting service pushes it) and release-check --assets judges it.
        # An absent cutover file keeps the signature check (the behaviour before the cutover existed); a present one that is
        # not exactly one vN.N.N line fails closed. An optional second record, `signed-from vN.N.N` (at most one, at or
        # above the cutover, else the guard fails closed), makes a tag at or above it carry an SSH signature (ADR 0199);
        # This guard checks only that an SSH signature is present (and no PGP or X.509 one); it does not verify it. The
        # runner holds no key: release-check --assets verifies the signature against the release key.
        run: |
          # In an `if`, not bare: bash 3.2 (macOS, where the tests run this script) does not stop `set -e` on a lone [[ ]].
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "not a version tag: $GITHUB_REF_NAME" >&2; exit 1; fi
          # actions/checkout writes the pushed tag as a lightweight ref to its commit (v0.1.1's run failed here), so
          # the tag object itself is fetched from origin before it is judged.
          git fetch -q --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]
          # ge succeeds when version $1 is >= version $2 (both vN.N.N), compared field by field as numbers.
          ge() {
            local i x y
            IFS=. read -r -a x <<<"${1#v}"
            IFS=. read -r -a y <<<"${2#v}"
            for i in 0 1 2; do
              if (( 10#${x[i]} > 10#${y[i]} )); then return 0; fi
              if (( 10#${x[i]} < 10#${y[i]} )); then return 1; fi
            done
            return 0
          }
          need_signature=yes
          if raw="$(git show "$(git rev-parse "$GITHUB_REF_NAME^{commit}"):docs/release-cutover" 2>/dev/null)"; then
            cutover="$(printf '%s\n' "$raw" | awk '!/^[[:space:]]*#/ && !/^[[:space:]]*$/ && $1 != "signed-from"')"
            if ! [[ "$cutover" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "docs/release-cutover is not exactly one vN.N.N line" >&2; exit 1; fi
            if ge "$GITHUB_REF_NAME" "$cutover"; then need_signature=no; fi
            signed_from_line="$(printf '%s\n' "$raw" | awk '!/^[[:space:]]*#/ && $1 == "signed-from"')"
            if [ -n "$signed_from_line" ]; then
              signed_from_re='^[[:space:]]*signed-from[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$'
              if ! [[ "$signed_from_line" =~ $signed_from_re ]]; then echo "docs/release-cutover has more than one signed-from line, or one that is not signed-from vN.N.N" >&2; exit 1; fi
              signed_from="${BASH_REMATCH[1]}"
              if ! ge "$signed_from" "$cutover"; then echo "docs/release-cutover: signed-from $signed_from is below the cutover $cutover" >&2; exit 1; fi
              if ge "$GITHUB_REF_NAME" "$signed_from"; then need_signature=ssh; fi
            fi
          fi
          if [ "$need_signature" = ssh ]; then
            tag_body="$(git cat-file tag "$GITHUB_REF_NAME")"
            if ! printf '%s\n' "$tag_body" | grep -q -e '-----BEGIN SSH SIGNATURE-----'; then echo "tag $GITHUB_REF_NAME has no SSH signature" >&2; exit 1; fi
            if printf '%s\n' "$tag_body" | grep -q -e '-----BEGIN PGP SIGNATURE-----' -e '-----BEGIN SIGNED MESSAGE-----'; then echo "tag $GITHUB_REF_NAME carries a PGP or X.509 signature: only SSH signs releases" >&2; exit 1; fi
          elif [ "$need_signature" = yes ]; then
            git cat-file tag "$GITHUB_REF_NAME" | grep -q -e '-----BEGIN PGP SIGNATURE-----' -e '-----BEGIN SSH SIGNATURE-----'
          fi
      - name: The candidate is on main
        # The commit comes from the tag: what GITHUB_SHA holds on an annotated-tag push (commit or tag object) is not
        # relied on anywhere in this workflow.
        run: git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" origin/main
      - name: No older draft release is left behind
        # An unpublished older draft stops this one: publish or delete it first. Needs jq (on GitHub runners).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          scripts/draft-guard "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases.json"
  test-macos:
    name: test (macos)
    # Runs on every v* tag (macOS runs only on tagged releases), in parallel with build. ADVISORY (ADR 0079): not in release.RequiredChecks and no
    # job needs it, so a macOS runner outage never blocks a tag; its result is on the tag's run. Not on a workflow_dispatch dry run: with the Mac
    # runner offline the job would queue for up to 24 h and the next dry run would wait behind it (concurrency release-<ref>, no cancel).
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 30
    runs-on: [self-hosted, rh-macos]
    env:
      # release.yml sets CGO_ENABLED=0 for the reproducible builds; go test -race needs cgo, as it had in ci.yml.
      CGO_ENABLED: "1"
    steps:
      # The build cache and temp dir are job-local under RUNNER_TEMP, which is wiped below (the self-hosted runner is reused
      # between jobs). The module cache is the host's shared one (GOPATH and GOMODCACHE stay at the host's defaults), checked
      # against go.sum on every run by `go mod verify` below.
      - name: Job-local Go build cache and temp dir
        run: |
          mkdir -p "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/tmp"
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the module cache against go.sum
        run: |
          set -euo pipefail
          go mod verify
      - run: go vet ./...
      # -timeout 20m: under -race, scripts/releasecheck takes about 4x as long on the macOS runner (2 vCPU, Intel x64) as
      # on Linux, past go test's default 10 m (run 41292329623). A real hang still fails.
      - name: go test
        env:
          MASH_FORBIDDEN_WORDS: ${{ vars.MASH_FORBIDDEN_WORDS }}
        run: |
          set -eu
          # scripts/releasecheck builds release binaries and takes about 440 s even without -race, a third of the
          # job's wall time on the 2-vCPU macOS runner (#275); Linux runs it, with -race, on every event.
          # shellcheck disable=SC2046 # the package list is meant to split into one argument per import path
          # -count=1: never replay a cached pass; tests read files Go's test cache does not track (#1387).
          go test -count=1 -race -timeout 20m $(go list ./... | grep -v '/scripts/releasecheck$')
      - name: Leave nothing behind
        if: always()
        run: |
          chmod -R u+w "$RUNNER_TEMP" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/tmp"
          git clean -ffdx || true
  build:
    # On a tag push the guard must have succeeded. On a dispatch the guard is skipped (a skipped needed job skips its
    # dependents unless the condition says otherwise), so a dispatch on main builds anyway, and on any other ref nothing
    # builds, which skips every job below too. !cancelled() keeps a failed guard (not skipped) from running the build.
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.guard.result == 'skipped')) }}
    timeout-minutes: 30
    runs-on: [self-hosted, rh-linux]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build twice in fresh clones and compare
        env:
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          name="mash-${GOOS_T}-${GOARCH_T}"
          scripts/build-twice "$GOOS_T" "$GOARCH_T" "$version" "$commit" "dist/$name" mash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mash-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1
      - name: Build mashctl twice in fresh clones and compare
        env:
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          name="mashctl-${GOOS_T}-${GOARCH_T}"
          scripts/build-twice "$GOOS_T" "$GOARCH_T" "$version" "$commit" "dist/$name" mashctl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1
  draft:
    # A draft exists only once the provenance, the SBOMs and their attestations do, so publishing can never precede or outlive a
    # failed attestation.
    # Attestation requires a public repository (or GitHub Enterprise Cloud); this repository is public.
    needs: [build, sums, attest, sbom, attest-sbom]
    # An explicit status function: a skipped guard (a dry run) would otherwise skip every job downstream of build. On a push
    # the guard succeeds and every need must have succeeded.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && needs.sums.result == 'success' && needs.attest.result == 'success' && needs.sbom.result == 'success' && needs['attest-sbom'].result == 'success' }} # never on a dry run: it creates the release
    timeout-minutes: 30
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: write
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          # The two scripts are the repository's own files at this commit, byte for byte (the sums job copied them).
          for n in install.sh mash-local-nats-setup.sh; do
            git show "$commit:scripts/$n" | cmp -s - "dist/$n" || { echo "dist/$n is not scripts/$n at $commit" >&2; exit 1; }
          done
          # SHA256SUMS was made by the sums job and attested with the binaries: it is attached unchanged.
          [ -f dist/SHA256SUMS ] || { echo "the sums artifact brought no SHA256SUMS" >&2; exit 1; }
          # The base is the highest PUBLISHED release that is an ancestor of the commit, not the last tag: the compare link
          # runs from it. None means the first release.
          gh release list --limit 200 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          prev="$(scripts/notes-base "$GITHUB_REF_NAME" "$commit" "$RUNNER_TEMP/releases.json")"
          # The release page is built from the release notes (ADR 0105 below it): for 0.5.7 and later
          # the text of docs/release-notes/<version>.md, which shares its Summary and Upgrading with the change log entry, and
          # for earlier versions the change log section, the same text (ADR 0105). Prose first, then the lists, never raw commit
          # subjects. `release-page` fails when the version has no notes file (or, below 0.5.7, no section), and `check-notes`
          # (internal/releasenotes, the test the release gate applies too) fails when the notes do not open with a Summary and an
          # Upgrading section, still hold the REPLACE THIS placeholder, or end a line in a commit hash. From 0.5.7 `check-entry`
          # also holds the change log entry to the change-log rubric. All run before the draft exists. The compare link is the
          # last paragraph; the first release has no previous one.
          version="${GITHUB_REF_NAME#v}"
          go run ./scripts/changelog release-page --version "$version" > dist/RELEASE-NOTES.md
          if [ "$(printf '%s\n0.5.7\n' "$version" | sort -V | head -n 1)" = "0.5.7" ]; then
            go run ./scripts/changelog check-entry --version "$version"
          fi
          if [ -n "$prev" ]; then
            printf '\nFull changes: [%s...%s](%s/%s/compare/%s...%s)\n' "$prev" "$GITHUB_REF_NAME" "${GITHUB_SERVER_URL:-https://github.com}" "${GITHUB_REPOSITORY}" "$prev" "$GITHUB_REF_NAME" >> dist/RELEASE-NOTES.md
            go run ./scripts/changelog check-notes dist/RELEASE-NOTES.md --version "$version" --prev "${prev#v}"
          else
            go run ./scripts/changelog check-notes dist/RELEASE-NOTES.md
          fi
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE-NOTES.md \
            dist/mash-darwin-amd64 dist/mash-darwin-arm64 dist/mash-linux-amd64 dist/mash-linux-arm64 \
            dist/mashctl-darwin-amd64 dist/mashctl-darwin-arm64 dist/mashctl-linux-amd64 dist/mashctl-linux-arm64 \
            dist/install.sh dist/mash-local-nats-setup.sh \
            dist/mash-darwin-amd64.cdx.json dist/mash-darwin-arm64.cdx.json dist/mash-linux-amd64.cdx.json dist/mash-linux-arm64.cdx.json \
            dist/mashctl-darwin-amd64.cdx.json dist/mashctl-darwin-arm64.cdx.json dist/mashctl-linux-amd64.cdx.json dist/mashctl-linux-arm64.cdx.json \
            dist/mash.intoto.jsonl dist/SHA256SUMS
          # The guard job's check and this creation are not atomic, and the concurrency group is per tag, so two tags'
          # runs can both pass the guard. Re-check now that the draft exists: a lower draft or a higher published
          # release makes THIS run fail, naming it. The guard never deletes: the draft stays for the maintainer to resolve
          # (`gh release delete <tag>` after checking its state, or publish the lower one first, then rerun; ADR 0001, rule 5).
          scripts/draft-guard --after-create "$GITHUB_REF_NAME"
  sums:
    # SHA256SUMS lists every asset except the provenance bundle (which cannot list itself): the eight binaries (mash and mashctl),
    # the two scripts (install.sh and mash-local-nats-setup.sh, copied here from the checkout of the tagged commit) and the eight SBOMs.
    # The scripts travel on as the release-scripts artifact, so the attestation and the draft use these very bytes. It is made here, before the attestation, so the attest job can attest it. Named, not globbed, so a missing
    # file fails here and a stray one is never listed.
    needs: [build, sbom]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sbom.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: read
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mash-* # the four mash binaries (mashctl-* does not match this)
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mashctl-* # the four mashctl binaries
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-* # the eight SBOMs (sbom-<os>-<arch> and sbom-mashctl-<os>-<arch>)
          path: dist
          merge-multiple: true
      - name: Copy the two scripts into dist
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/mash-local-nats-setup.sh dist/
          chmod 0755 dist/install.sh dist/mash-local-nats-setup.sh
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum \
            mash-darwin-amd64 mash-darwin-arm64 mash-linux-amd64 mash-linux-arm64 \
            mashctl-darwin-amd64 mashctl-darwin-arm64 mashctl-linux-amd64 mashctl-linux-arm64 \
            install.sh mash-local-nats-setup.sh \
            mash-darwin-amd64.cdx.json mash-darwin-arm64.cdx.json mash-linux-amd64.cdx.json mash-linux-arm64.cdx.json \
            mashctl-darwin-amd64.cdx.json mashctl-darwin-arm64.cdx.json mashctl-linux-amd64.cdx.json mashctl-linux-arm64.cdx.json \
            > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scripts # not mash-*: no binary pattern may match it
          path: |
            dist/install.sh
            dist/mash-local-nats-setup.sh
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  attest:
    # Build provenance for the eight binaries (mash and mashctl) and the two scripts, made in-job on the self-hosted runner that holds them: actions/attest-build-provenance
    # signs with this workflow's own identity, so no reusable workflow of another repository runs (ADR 0079). The Sigstore
    # bundle it writes is kept as mash.intoto.jsonl, which the draft job attaches. SHA256SUMS (made by the sums job, which lists
    # the binaries, the script and the SBOMs, not this bundle) is attested here too. The three permissions belong to this job only.
    needs: [build, sums]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sums.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      id-token: write # the OIDC token the attestation is signed with
      attestations: write
      contents: read
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mash-* # the mash binaries only: never an SBOM artifact (sbom-*) another job may already have uploaded
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mashctl-* # the mashctl binaries only
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-scripts # the two scripts, as the sums job copied them
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums
          path: dist
      - name: Attest build provenance
        # Provenance for the eight binaries and the two scripts (what consumers download) and for SHA256SUMS, which covers every other asset.
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mash-linux-amd64
            dist/mash-linux-arm64
            dist/mash-darwin-amd64
            dist/mash-darwin-arm64
            dist/mashctl-linux-amd64
            dist/mashctl-linux-arm64
            dist/mashctl-darwin-amd64
            dist/mashctl-darwin-arm64
            dist/install.sh
            dist/mash-local-nats-setup.sh
            dist/SHA256SUMS
      - name: Keep the provenance bundle as mash.intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ "$(find dist -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l | tr -d ' ')" = 11 ] || { echo "dist does not hold exactly the eight binaries, the two scripts and SHA256SUMS" >&2; ls dist >&2; exit 1; }
          [ -s "$BUNDLE" ] || { echo "the attestation wrote no bundle" >&2; exit 1; }
          mkdir -p provenance
          cp "$BUNDLE" provenance/mash.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/mash.intoto.jsonl
          if-no-files-found: error
          retention-days: 1
  sbom:
    # One CycloneDX 1.5 SBOM per binary, made from the built binary itself (its embedded module list), so it describes
    # exactly the bytes a consumer downloads. The tool is the runners' pinned copy at /opt/ci-tools/bin, checked for v1.9.0
    # before use (no go install, no fallback); the job reads and uploads, nothing else.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mash-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: SBOM of each binary
        env:
          GOOS_T: ${{ matrix.goos }}
          GOARCH_T: ${{ matrix.goarch }}
          CDX: /opt/ci-tools/bin/cyclonedx-gomod
          CDX_WANT: v1.9.0
        run: |
          set -euo pipefail
          if [ ! -x "$CDX" ]; then
            echo "::error::cyclonedx-gomod is not installed at $CDX on this runner; the runners carry it pinned at $CDX_WANT, ask operations to install it. This workflow does not fall back to go install."
            exit 1
          fi
          found="$("$CDX" version 2>/dev/null | awk '$1=="Version:"{print $2}' || true)"
          if [ "$found" != "$CDX_WANT" ]; then
            echo "::error::cyclonedx-gomod at $CDX is version ${found:-none}, but this workflow wants exactly $CDX_WANT; ask operations to correct the runner. This workflow does not fall back to go install."
            exit 1
          fi
          echo "cyclonedx-gomod $found at $CDX"
          for program in mash mashctl; do
            name="${program}-${GOOS_T}-${GOARCH_T}"
            chmod +x "dist/$name" # artifact downloads drop the mode; the tool reads the build info of an executable
            "$CDX" bin -json -output-version 1.5 -version "$RELEASE_TAG" -output "dist/$name.cdx.json" "dist/$name"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mashctl-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
          if-no-files-found: error
          retention-days: 1
  attest-sbom:
    needs: sbom
    if: ${{ !cancelled() && needs.sbom.result == 'success' }} # explicit: see build
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      id-token: write # the OIDC token the attestation is signed with
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mash-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Attest the SBOM, with the binary as its subject
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}
          sbom-path: dist/mash-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Attest the mashctl SBOM, with the binary as its subject
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/mashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          sbom-path: dist/mashctl-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
  dry-run-verify:
    # The dry run's verdict: everything the release gate checks about the attestations and provenance, here, with nothing
    # published. Only a dispatch on main runs it; on a tag push the draft job takes its place. It reads and verifies, and
    # holds no id-token.
    needs: [build, sums, attest, sbom, attest-sbom]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.sums.result == 'success' && needs.attest.result == 'success' && needs.sbom.result == 'success' && needs['attest-sbom'].result == 'success' }}
    timeout-minutes: 20
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: read
    steps:
      # The runners are persistent: a file an earlier job left in dist or provenance must never reach this one.
      - name: Start from empty dist
        run: |
          set -euo pipefail
          rm -rf dist provenance && mkdir -p dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist # the eight binaries, the two scripts, the eight SBOMs, SHA256SUMS and mash.intoto.jsonl
          merge-multiple: true
      - name: Verify the build provenance, the build attestations and the SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          [ -f mash.intoto.jsonl ] || { echo "no mash.intoto.jsonl was downloaded" >&2; ls >&2; exit 1; }
          # The workflow that made the provenance must be release.yml: every line (a Sigstore bundle, or a bare DSSE envelope) of the
          # provenance names it as its entry point (SLSA v0.2 configSource.entryPoint, or v1 externalParameters.workflow.path).
          jq -r '(.dsseEnvelope.payload // .payload)' mash.intoto.jsonl | while read -r p; do
            echo "$p" | base64 -d | jq -e '(.predicate.invocation.configSource.entryPoint // .predicate.buildDefinition.externalParameters.workflow.path) == ".github/workflows/release.yml"' > /dev/null \
              || { echo "mash.intoto.jsonl was not made by .github/workflows/release.yml" >&2; exit 1; }
          done
          [ -f SHA256SUMS ] || { echo "no SHA256SUMS was downloaded" >&2; ls >&2; exit 1; }
          # SHA256SUMS is a subject of the same attestation as the binaries.
          gh attestation verify SHA256SUMS -R "${{ github.repository }}" --bundle mash.intoto.jsonl --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          gh attestation verify SHA256SUMS -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          # The two scripts are attested subjects like the binaries (they have no SBOM).
          for n in install.sh mash-local-nats-setup.sh; do
            echo "== $n"
            gh attestation verify "$n" -R "${{ github.repository }}" --bundle mash.intoto.jsonl --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "$n" -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          done
          for n in mash-linux-amd64 mash-linux-arm64 mash-darwin-amd64 mash-darwin-arm64 mashctl-linux-amd64 mashctl-linux-arm64 mashctl-darwin-amd64 mashctl-darwin-arm64; do
            echo "== $n"
            # The provenance was made from a branch ref (main), not a tag, so no source tag applies: the signer workflow and
            # source ref pin it. The attached bundle must verify offline for this binary, as must the attestation GitHub holds.
            gh attestation verify "$n" -R "${{ github.repository }}" --bundle mash.intoto.jsonl --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "$n" -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "$n" -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --predicate-type https://cyclonedx.org/bom --format json > "$RUNNER_TEMP/$n.sbom-verify.json"
            # actions/attest-sbom stores the SBOM verbatim as the predicate: a verified statement about THIS binary must
            # carry exactly the attached .cdx.json (`jq -S` sorts keys, so only content is compared).
            sum="$(sha256sum "$n" | cut -d' ' -f1)"
            jq -S --arg sum "$sum" '[.[].verificationResult.statement | select(any(.subject[]; .digest.sha256 == $sum)) | .predicate] | first' \
              "$RUNNER_TEMP/$n.sbom-verify.json" > "$RUNNER_TEMP/$n.predicate.json"
            jq -S . "$n.cdx.json" > "$RUNNER_TEMP/$n.sbom.json"
            if ! cmp -s "$RUNNER_TEMP/$n.predicate.json" "$RUNNER_TEMP/$n.sbom.json"; then
              echo "the verified SBOM attestation for $n does not carry $n.cdx.json" >&2
              exit 1
            fi
          done
  dry-run-notes:
    # The dry run's proof of the release-notes path (ADR 0105, the release notes file): the draft job builds the notes only on a tag push, so a
    # change to `scripts/changelog release-page`, `check-entry`, `check-notes` or the compare line would otherwise first run at
    # a real release. This job runs the same commands on the latest released version (its release notes file from 0.5.7, its
    # change log section before), in $RUNNER_TEMP: no dist, no draft, no release, no token.
    # It needs no other job, and no job needs it.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 20
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Release notes for the latest released section
        run: |
          set -euo pipefail
          # The latest released version is the first numbered heading of the change log (`## [Unreleased]` is skipped).
          version="$(sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\] - .*/\1/p' CHANGELOG.md | head -n 1)"
          [ -n "$version" ] || { echo "CHANGELOG.md has no released version section (## [X.Y.Z] - date)" >&2; exit 1; }
          go run ./scripts/changelog release-page --version "$version" > "$RUNNER_TEMP/notes.md"
          if [ "$(printf '%s\n0.5.7\n' "$version" | sort -V | head -n 1)" = "0.5.7" ]; then
            go run ./scripts/changelog check-entry --version "$version"
          fi
          # The base is the highest release tag strictly below the version, as the draft job finds one. None is fine.
          prev="$({ git tag --list 'v[0-9]*.[0-9]*.[0-9]*'; echo "v$version"; } | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -Vu | awk -v v="v$version" '$0 == v { exit } { p = $0 } END { print p }')"
          if [ -n "$prev" ]; then
            printf '\nFull changes: [%s...%s](%s/%s/compare/%s...%s)\n' "$prev" "v$version" "${GITHUB_SERVER_URL:-https://github.com}" "${GITHUB_REPOSITORY}" "$prev" "v$version" >> "$RUNNER_TEMP/notes.md"
            go run ./scripts/changelog check-notes "$RUNNER_TEMP/notes.md" --version "$version" --prev "${prev#v}"
          else
            go run ./scripts/changelog check-notes "$RUNNER_TEMP/notes.md"
          fi

name: lead-approved-reset
# The lead-approved label lets a pull request into the merge queue (.mergify.yml, docs/branch-protection.md), so it must
# never cover code pushed after it was applied: this removes it on every push to a pull request.
#
# Trust: pull_request_target gives a token that can edit labels on a pull request from a fork, and runs THIS file from
# the base branch. So there is no checkout and nothing from the pull request is built, sourced or run; the only input is
# the pull request number from the event, passed through env, never through the text of the script. The token holds
# pull-requests: write and nothing else.
on:
  pull_request_target:
    types: [synchronize]
permissions:
  pull-requests: write
concurrency:
  group: lead-approved-reset-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reset:
    name: reset
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Remove lead-approved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # An absent label is the common case and is fine; any other failure (permissions, network) fails the job.
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -x 'lead-approved' > /dev/null; then
            gh pr edit "$PR" --remove-label lead-approved
          fi

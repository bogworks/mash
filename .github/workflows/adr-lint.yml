name: adr-lint
# Architecture decision records are enforced on every pull request (scripts/adrlint has the code, docs/decisions/README.md
# the rules): the records themselves are linted, an accepted record may not be rewritten (compared with the base branch),
# and the pull request body must carry one "Decision: none" or "Decision: ADR-NNNN" line that names a record this pull
# request adds or changes. "none" on a change to a protected path (the SAP, store, config, endpoint, plugin, MCP, host, spool and render code, docs/decisions/, the merge gate, workflows, actions, release tests and branch-protection doc; see protected in scripts/adrlint/main.go) needs the decision-confirmed
# label, which a reviewer applies; that is why labeled and unlabeled re-run it. The label counts only in a run whose
# event action is not synchronize, reopened or opened (PR_ACTION): on a push label-reset.yml removes it in a run that
# starts no new one, and this run may have read it first. The labels are read live (gh pr view), not from the event.
# This check becomes a Mergify queue condition and a required check in a follow-up pull request, once this workflow is on main.
#
# Trust: this runs on pull_request_target, so GitHub runs THIS workflow file from the BASE branch; a pull request cannot
# edit it to pass its own gate. The checker is built from the base branch (checked out in trusted/) and pointed at the
# pull request's head (checked out in pr/) with --root. The pull request is data only: nothing from pr/ is ever built,
# sourced or run, no secret is used, and the token is contents: read. A pull request that changes this workflow or
# scripts/adrlint is judged by the base branch's versions; its change takes effect once it has merged. (The first pull
# request that adds scripts/adrlint has no checker at its base and cannot pass this workflow until a maintainer merges it.)
# This job runs on the repository's self-hosted runners (labels self-hosted, rh-linux), like every job (ADR 0079); a pull
# request from a fork is not skipped, it runs there once a person approves the run. Its fork safety does not depend on the
# runner: the trust logic above (base-branch checker, pull request as data only) is the same wherever it runs, and nothing
# from the pull request is run. The body and the labels reach the tool through env, never through the text of the shell
# script. A fork checkout may lack the base commit, so the base commit
# is fetched into pr/ from the trusted/ checkout (a local fetch, no network or credentials) as origin/<base>.
#
# Mergify's merge-queue drafts are skipped (the job reports SKIPPED, which Mergify and the ruleset accept): they carry no
# Decision line, and the pull request they batch was judged on its own head. The skip is a job-level if that needs ALL of:
# the head ref starts with mergify/merge-queue/, the head is in this same repository, and the pull request's author is the
# Mergify bot (mergify[bot]). A pull request author controls the branch name, so the prefix alone would let anyone who can
# push a branch bypass the check; a fork pull request, or a human's pull request on such a branch name, is still judged.
# The fields are base-repository-trusted event fields (this runs on pull_request_target).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.27.4
concurrency:
  group: adr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  adr-lint:
    if: ${{ !(startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'mergify[bot]') }}
    runs-on: [self-hosted, rh-gate]
    timeout-minutes: 10
    steps:
      - name: Check out the base branch (the trusted checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pull request (data only, never run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          # checkout v7 refuses a fork's code in a pull_request_target run unless told. This is the deliberate case: the
          # pull request is data for the checker run from trusted/, and nothing from pr/ is ever executed.
          allow-unsafe-pr-checkout: true
      - name: Bring the base branch into pr/ (from trusted/, locally)
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE/trusted" "+$BASE_SHA:refs/remotes/origin/$BASE_REF"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trusted/go.mod
          cache: false
      - name: Build the checker from the base branch
        id: build
        working-directory: trusted
        run: |
          set -euo pipefail
          # Bootstrap: the pull request that adds the checker has no base checker to run. Once it is on the base
          # branch this always builds; a base without it is the only case that skips.
          if [ ! -d scripts/adrlint ]; then
            echo "::notice::the base branch has no scripts/adrlint yet; skipping (only the pull request that adds it)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go build -o "$RUNNER_TEMP/adrlint" ./scripts/adrlint
      - name: Lint the records
        if: steps.build.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          # Data through env: extra forbidden words kept in a repository variable, not in the tree. This workflow runs
          # from the base branch, so this line takes effect once it has merged.
          MASH_FORBIDDEN_WORDS: ${{ vars.MASH_FORBIDDEN_WORDS }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/adrlint" docs --root "$GITHUB_WORKSPACE/pr" --base "origin/$BASE_REF"
      - name: Check the pull request's decision
        if: steps.build.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The current labels, not the event payload's snapshot; an API error fails the step (set -e on the assignment).
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          export PR_LABELS="$labels"
          # --no-renames: a rename is listed as a delete plus an add, so the old path (say a protected one) is in the list.
          git -C "$GITHUB_WORKSPACE/pr" diff --no-renames --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/files"
          "$RUNNER_TEMP/adrlint" pr --root "$GITHUB_WORKSPACE/pr" --files "$RUNNER_TEMP/files"
